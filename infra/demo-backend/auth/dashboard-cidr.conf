# Dashboard-backend egress CIDR allowlist for /antibot/v1/* (B10).
#
# Shipped committed with safe loopback-only defaults so:
#   - smoke / CI bring up the stack out of the box;
#   - `nginx -t` always passes on a fresh checkout (the LB includes this
#     file and would fail validation if it were missing).
#
# Operators MUST edit this file in-place on the VM before exposing /antibot/v1/
# to the dashboard-backend in prod — replace the loopback allow with the real
# dashboard-backend egress CIDR(s). Local edits should NOT be committed back
# (this file is intentionally not gitignored so the baseline travels with the
# repo, but production CIDR lists are operational state).
#
# Example for a single host:
#   allow 203.0.113.42/32;
#   deny all;
#
# Example for a small private subnet:
#   allow 10.0.5.0/24;
#   deny all;

allow 127.0.0.1/32;        # local dev / curl-from-backend / CI smoke
allow ::1/128;
deny all;
