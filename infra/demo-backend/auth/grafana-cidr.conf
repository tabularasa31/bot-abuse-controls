# CIDR-allowlist for /grafana/ (BAC log viewer UI), included from lb.conf's
# `location /grafana/` block. Same baseline-commit / edit-on-VM pattern as
# auth/dashboard-cidr.conf:
#
# Shipped committed with safe loopback-only defaults so:
#   - smoke / CI bring up the stack out of the box;
#   - `nginx -t` always passes on a fresh checkout (the LB `include`s this
#     file and would fail validation if it were missing).
#
# Operators MUST edit this file in-place on the VM before exposing the log
# viewer in prod — replace the loopback allow with the real reviewer source
# CIDR(s). Local edits should NOT be committed back (this file is
# intentionally not gitignored so the baseline travels with the repo, but
# production CIDR lists are operational state).
#
# Example for office egress:
#   allow 203.0.113.0/24;
#   deny all;
#
# Defence-in-depth: even with GF_AUTH_ANONYMOUS_ENABLED=true in compose,
# this allowlist is the first gate the viewer URL has to pass.

allow 127.0.0.1/32;        # local dev / ssh-tunnel from operator laptop
allow ::1/128;
deny all;
