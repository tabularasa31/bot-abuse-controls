# [B6] No edge -> backend auth at the application layer. This file is
# intentionally empty.
#
# Active when AUTH_MODE=off in .env. NOT for any reachable deploy — the LB
# becomes unauthenticated to anyone who can route packets to :443. Useful only
# for local debugging where the LB :443 is bound to a loopback IP and you want
# to bypass mTLS/allowlist entirely while reproducing a problem.
#
# Anything that lands here is reading "no auth.conf directives" by design.
