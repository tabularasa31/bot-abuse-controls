# [B10] mTLS enforcement for Channel C (`location /` in nginx/lb.conf).
#
# Active when AUTH_MODE=mtls. Pair to auth/mtls.conf (server-level), which
# sets `ssl_verify_client optional` so the TLS handshake succeeds for clients
# without certs (e.g. dashboard-backend over /antibot/v1/*); enforcement
# moves here, gating only the catalog/log paths.
#
# `if` directive is generally discouraged but is safe for a static return
# (nginx wiki "If is Evil" specifically allows return/rewrite). $ssl_client_verify
# values: SUCCESS (valid cert), NONE (no cert), FAILED:<reason>.
# 495 = nginx-specific "SSL Certificate Error".
if ($ssl_client_verify != "SUCCESS") {
    return 495;
}
