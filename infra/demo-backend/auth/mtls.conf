# [B6] mTLS — production-path per
# docs/architecture/config-distribution.md §Channel C "Auth/transport".
#
# Active when AUTH_MODE=mtls in .env (docker-compose.backend.yml mounts the
# matching auth/<mode>.conf as /etc/nginx/conf.d/auth.conf, included from
# nginx/lb.conf server{}).
#
# edge-ca.crt is generated by scripts/gen-certs.sh (B6) and signs every edge
# client cert.
#
# `ssl_verify_client optional` (not `on`) — PR-58 review fix. With `on`,
# TLS handshake rejects ANY client without a valid cert BEFORE nginx
# location matching runs, so /antibot/v1/* (dashboard-backend API, B10)
# would also be gated even though its independent CIDR-allowlist +
# bearer-token layers are the documented prod auth path. With `optional`
# nginx still requests and validates the cert when presented, populates
# $ssl_client_verify, and lets each location decide whether to enforce.
# The enforcement check lives in nginx/lb.conf's `location /` (catalog
# + health, Channel C); /antibot/v1/ skips it.
ssl_client_certificate /etc/nginx/certs/edge-ca.crt;
ssl_verify_client      optional;
ssl_verify_depth       2;
