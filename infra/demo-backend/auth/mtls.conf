# [B6] mTLS — production-path per
# docs/architecture/config-distribution.md §Channel C "Auth/transport".
#
# Active when AUTH_MODE=mtls in .env (docker-compose.backend.yml mounts the
# matching auth/<mode>.conf as /etc/nginx/conf.d/auth.conf, included from
# nginx/lb.conf server{}).
#
# edge-ca.crt is generated by scripts/gen-certs.sh (B6) and signs every edge
# client cert. ssl_verify_client=on rejects the TLS handshake when the client
# presents no cert, an expired cert, or a cert not signed by edge-CA — these
# fail with 400 "No required SSL certificate was sent" from nginx, which is
# also what acceptance check #7-mtls asserts.
ssl_client_certificate /etc/nginx/certs/edge-ca.crt;
ssl_verify_client      on;
ssl_verify_depth       2;
