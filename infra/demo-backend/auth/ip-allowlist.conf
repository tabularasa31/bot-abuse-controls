# [B6] IP allowlist — demo default per
# docs/architecture/config-distribution.md §Channel C "Auth/transport"
# (mTLS is preferred; IP allowlist from CDN operator's egress range is the named
# fallback). Active when AUTH_MODE=ip-allowlist in .env (default).
#
# Этот файл — server-level slot. Для ip-allowlist здесь ничего не требуется:
# сам allow/deny enforcement живёт в auth/ip-allowlist-channelc.conf, который
# монтируется внутрь `location /` (Channel C). Это нужно, чтобы /antibot/v1/*
# (dashboard policy API, B10) НЕ гейтилось edge-allowlist'ом — у него своя
# CIDR-allowlist в auth/dashboard-cidr.conf на location-уровне.
#
# Сам файл сохраняем (а не пустой), чтобы compose bind-mount всегда находил
# источник, и комментарий объяснял, почему server-level пуст.
