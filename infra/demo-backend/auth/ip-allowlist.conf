# [B6] IP allowlist — demo default per
# docs/architecture/config-distribution.md §Channel C "Auth/transport"
# (mTLS is preferred; IP allowlist from CDN operator's egress range is the named
# fallback). Active when AUTH_MODE=ip-allowlist in .env (default).
#
# Реальные allow-строки лежат в /etc/nginx/conf.d/allow.list, который
# монтируется из infra/demo-backend/auth/allow.list (см. allow.list.example
# для шаблона). Это позволяет редактировать allowlist без правок Lua/compose
# и без regenerate.sh — `docker compose exec lb nginx -s reload` после edit'а.
#
# `deny all;` идёт ПОСЛЕ include — без него nginx по умолчанию пропускает всех.
include /etc/nginx/conf.d/allow.list;
deny all;
