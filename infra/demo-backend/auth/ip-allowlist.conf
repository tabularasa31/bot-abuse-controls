# [B6] IP allowlist — demo default per
# docs/architecture/config-distribution.md §Channel C "Auth/transport"
# (mTLS is preferred; IP allowlist for the edge pool's egress range is the named
# fallback). Active when AUTH_MODE=ip-allowlist in .env (default).
#
# This file is the server-level slot. For ip-allowlist nothing is needed here:
# the allow/deny enforcement itself lives in auth/ip-allowlist-channelc.conf, which
# is mounted inside `location /` (Channel C). That is what keeps /antibot/v1/*
# (the dashboard policy API, B10) from being gated by the edge allowlist — it has its own
# CIDR allowlist in auth/dashboard-cidr.conf at the location level.
#
# The file is kept (rather than removed) so the compose bind mount always finds a
# source, and so this comment can explain why the server level is empty.
