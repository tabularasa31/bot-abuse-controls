# [B10] IP-allowlist enforcement for Channel C (`location /` in nginx/lb.conf).
#
# Active when AUTH_MODE=ip-allowlist. Pair to auth/ip-allowlist.conf (which
# is now empty server-level), enforcement moves here so /antibot/v1/* (the
# dashboard policy API) is NOT gated by the edge allow.list — it has its
# own dashboard-cidr.conf at the location level.
#
# The real allow lines are in /etc/nginx/conf.d/allow.list (see allow.list / .example).
include /etc/nginx/conf.d/allow.list;
deny all;
