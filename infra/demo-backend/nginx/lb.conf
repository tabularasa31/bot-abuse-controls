# [B1] TLS front for the antibot-backend HA pair (config-distribution §HA, §Auth).
# Terminates HTTPS on :443 (the Channel C pull endpoint, antibot.internal)
# and round-robins the two backend instances. fail-stale on the edge means a
# dead instance just degrades to the surviving one — no edge-side outage.

upstream antibot_backend {
    server backend-1:8080 max_fails=3 fail_timeout=10s;
    server backend-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 443 ssl;
    server_name antibot.internal;

    ssl_certificate     /etc/nginx/certs/backend.crt;
    ssl_certificate_key /etc/nginx/certs/backend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # mTLS is the preferred edge->backend auth per config-distribution §Auth.
    # Enable once the edge client CA is issued (one cert per pool, rotated via
    # Channel A / Puppet). Until then, restrict reach by firewall/IP allowlist
    # (see scripts/provision.sh and the README).
    # ssl_client_certificate /etc/nginx/certs/edge-ca.crt;
    # ssl_verify_client      on;

    location / {
        proxy_pass         http://antibot_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
