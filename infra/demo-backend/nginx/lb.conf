# [B1] TLS front for the antibot-backend HA pair (config-distribution §HA, §Auth).
# Terminates HTTPS on :443 (the Channel C pull endpoint, antibot.internal)
# and round-robins the two backend instances. fail-stale on the edge means a
# dead instance just degrades to the surviving one — no edge-side outage.

upstream antibot_backend {
    server backend-1:8080 max_fails=3 fail_timeout=10s;
    server backend-2:8080 max_fails=3 fail_timeout=10s;
}

# [B10] policy API rate-limit zone (PR-58 security audit #4): without it
# a leaked DASHBOARD_API_TOKEN + scripted PATCH-flood saturates pgxpool
# (PatchScalars holds a tx across UPSERT-with-lock + UPDATE + COMMIT) and
# starves /catalog/* reads — edge degrades to fail-stale for ALL clients.
# Bound at IP-level (dashboard-backend has stable egress) — `rate=20r/s`
# leaves ample headroom for legitimate dashboard activity (one operator
# rarely flips >2 toggles/sec) while keeping a flood survivable.
limit_req_zone $binary_remote_addr zone=antibot_api:1m rate=20r/s;

# Connection-header demultiplex for the /grafana/ proxy below.
# Grafana mixes plain HTTP (UI, static assets, REST API) with WebSocket
# (Grafana Live, alerts). Hardcoding `Connection: upgrade` would break
# keep-alive on every non-WS request; the canonical nginx pattern is to
# mirror the client's Upgrade intent — `upgrade` only when the client
# asked for it, `close` (effectively keep-alive default) otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name antibot.internal;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # [B6] Edge -> backend auth per config-distribution §Channel C
    # "Auth/transport". TWO mount-points per AUTH_MODE — split is necessary
    # because TLS handshake settings (ssl_verify_client) MUST live at
    # server-level, but auth ENFORCEMENT for Channel C must live inside
    # the catalog `location /` block — иначе оно гейтит и /antibot/v1/*
    # (dashboard policy API B10), и его независимые CIDR-allowlist +
    # bearer-token уровни (PR-58 review fix).
    #
    # auth.conf       — server-level: TLS-handshake setup (ssl_verify_client
    #                   optional for mtls; empty for ip-allowlist / off).
    # auth-channelc.conf — included only inside `location /` ниже,
    #                   делает реальную проверку (mtls — 495 на bad cert;
    #                   ip-allowlist — `include allow.list; deny all;`).
    include /etc/nginx/conf.d/auth.conf;

    # [B10] policy API — server-to-server with dashboard-backend (PR-58
    # security audit #1). Belt-and-braces:
    #   1. dashboard-cidr.conf bind-mounted with explicit CIDR-allowlist for
    #      the dashboard-backend egress + deny all (defence-in-depth in case
    #      AUTH_MODE=off / token leak; without it the bearer token alone
    #      protects multi-tenant policy on the public TLS vhost).
    #   2. limit_req zone bounds per-IP PATCH rate (see comment above zone).
    #   3. Standard proxy_pass to backend pool.
    # The file ships committed with loopback-only baseline so CI / smoke
    # bring up the stack out of the box; operators edit it in-place on the
    # VM with the real dashboard-backend egress CIDR before prod.
    location /antibot/v1/ {
        include /etc/nginx/dashboard-cidr.conf;
        limit_req zone=antibot_api burst=10 nodelay;

        proxy_pass         http://antibot_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout     2s;
    }

    # BAC log viewer — write path. Promtail on the edge VM pushes
    # JSON-encoded BAC_LOG records here; we gate it with the SAME
    # mTLS enforcement as the catalog path (auth/mtls-channelc.conf)
    # so the existing edge-client cert distribution covers it.
    #
    # Push-only proxy: we deliberately do NOT proxy /loki/api/v1/query
    # / labels / series. The read API is consumed by the in-network
    # grafana container at http://loki:3100 directly; surfacing it
    # publicly would expose all logs to anyone reaching this vhost.
    location = /loki/api/v1/push {
        include /etc/nginx/auth-channelc.conf;

        proxy_pass         http://loki:3100/loki/api/v1/push;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Request-Id      $request_id;
        # Match Loki's `ingestion_burst_size_mb: 16` (see
        # observability/loki-config.yaml). nginx's 1m default body limit
        # would 413 the first replay after a backend outage; setting it
        # ABOVE Loki's burst would let oversized pushes pass nginx only
        # to get 429'd by the distributor token bucket, wasting an LB
        # round-trip and a promtail retry slot. Keep them equal so the
        # 413 boundary at nginx matches the 429 boundary at Loki.
        client_max_body_size 16m;
        # Loki push is request/response — no need for long-poll/SSE knobs.
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # BAC log viewer — read path (Grafana UI). CIDR-allowlist mirrors the
    # /antibot/v1/* pattern: viewer access is operator/reviewer-scoped, NOT
    # public, even if the rest of this vhost happens to be reachable.
    # Grafana itself terminates at /grafana/ thanks to
    # GF_SERVER_SERVE_FROM_SUB_PATH=true, so we forward the URI unchanged.
    location /grafana/ {
        include /etc/nginx/grafana-cidr.conf;

        proxy_pass         http://grafana:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Grafana Live (alerts, real-time panels) uses WebSockets; pass
        # the upgrade headers so the SPA's live updates work. Connection
        # header is demultiplexed via the http-level `map` above so plain
        # HTTP requests keep their keep-alive behaviour.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        # Channel C enforcement: edge ↔ backend. mtls → 495 if cert missing/bad;
        # ip-allowlist → allow.list + deny all; off → no-op. Не применяется к
        # /antibot/v1/* (там свой dashboard-cidr.conf на location-уровне).
        include /etc/nginx/auth-channelc.conf;

        proxy_pass         http://antibot_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout     2s;
    }
}
