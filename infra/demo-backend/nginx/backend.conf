# Placeholder antibot-backend instance ([B1] provisioning).
# Returns a health JSON tagged with the container hostname so round-robin
# across the pair is observable from the LB. Replaced by the real Go service
# in [B2]/[B15] — same listen port, same /health contract.
server {
    listen 8080;

    location = /health {
        default_type application/json;
        add_header X-Backend $hostname always;
        return 200 '{"status":"ok","instance":"$hostname","role":"antibot-backend-placeholder"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","note":"placeholder; real Channel C API lands in B2/B3"}';
    }
}
