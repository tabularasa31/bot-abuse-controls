# Provisioner config — Grafana scans this folder on startup and registers
# every dashboard JSON it finds under it. We mount the same host folder twice
# in compose: once at /etc/grafana/provisioning/dashboards (this file) and
# once at /var/lib/grafana/dashboards/bac (the JSON files below).
apiVersion: 1

providers:
  - name: bac
    orgId: 1
    folder: BAC
    type: file
    # The dashboard JSON is bind-mounted :ro from the repo (the file IS
    # the source of truth, edited via PR). Match that with editable=false
    # + allowUiUpdates=false so Grafana renders a "read-only" badge in
    # the UI rather than offering a Save button whose writeback would
    # EROFS-fail against the mount. UI users who want to experiment can
    # "Save As..." to create a personal copy in Grafana's DB.
    disableDeletion: true
    editable: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/bac
