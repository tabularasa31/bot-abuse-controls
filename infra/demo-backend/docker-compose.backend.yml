# antibot-backend demo stack — PostgreSQL + HA backend pair behind a
# TLS-terminating LB. Substrate (compose/certs/LB) is [B1]; the backend image
# is the real Go service from [B2] (catalog server + log receiver + rDNS
# worker, ADR-005). App-level deploy with migrations is still [B15].
#
# Run on the demo VM:
#   cp .env.example .env && edit .env   # set POSTGRES_PASSWORD
#   ./scripts/gen-certs.sh              # self-signed cert for the LB
#   docker compose -f docker-compose.backend.yml up -d
#   ./scripts/verify.sh                 # acceptance checks
#
# `scripts/provision.sh` wraps all of the above plus host setup (docker, ufw).

services:
  postgres:
    image: postgres:16-alpine
    container_name: antibot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antibot}
      POSTGRES_USER: ${POSTGRES_USER:-antibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    # Bound to loopback only: the backend reaches Postgres over the compose
    # network (`postgres:5432`), never the public interface. The host port is
    # for operator psql / migrations from the VM itself.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antibot} -d ${POSTGRES_DB:-antibot}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # The HA pair ADR-005 requires. Both instances run the same Go binary from
  # antibot-backend/ (B2): catalog server + log receiver + rDNS worker. They
  # depend on Postgres being healthy before start.
  backend-1:
    build: &backend_build
      context: ../../antibot-backend
    image: antibot-backend:demo
    container_name: antibot-backend-1
    hostname: backend-1
    environment: &backend_env
      INSTANCE_NAME: backend-1
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-antibot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antibot}?sslmode=disable"
      # The slow catalogs (tls_fp_blocklist / ua_blacklist / ...) live in the git repo
      # at ../../catalogs/, mounted below as a read-only volume. Both
      # replicas read the same snapshot (the mtime cache in the reloader guards against
      # redundant YAML parses between ticks). See ADR-006.
      CATALOGS_DIR: "/catalogs"
      # [B9] the disk queue for the BAC_LOG sink. The path inside the container matches
      # the volume mounted below; without it, PostgreSQL downtime would lose
      # the log stream (acceptance B9, "the receiver does not lose logs").
      LOGS_SINK_SPOOL_DIR: "/var/lib/antibot-backend/log-spool"
      # [B10] the shared M2M secret for bearer auth between the dashboard backend and
      # antibot-backend (/antibot/v1/*). Without it the policy API is not
      # registered (fail-closed, with a warning in the log).
      DASHBOARD_API_TOKEN: "${DASHBOARD_API_TOKEN:-}"
    depends_on: &backend_depends
      postgres:
        condition: service_healthy
    volumes:
      # A per-instance volume, so that draining after one replica restarts does not
      # overlap with the other (the same file read by both
      # replicas would produce a duplicate in logs).
      - log-spool-1:/var/lib/antibot-backend/log-spool
      # The slow catalogs are read-only: the backend only reads them; edits go
      # through a git PR (see catalogs/README.md).
      - ../../catalogs:/catalogs:ro
    restart: unless-stopped

  backend-2:
    build: *backend_build
    image: antibot-backend:demo
    container_name: antibot-backend-2
    hostname: backend-2
    environment:
      <<: *backend_env
      INSTANCE_NAME: backend-2
    depends_on: *backend_depends
    volumes:
      - log-spool-2:/var/lib/antibot-backend/log-spool
      - ../../catalogs:/catalogs:ro
    restart: unless-stopped

  # Small LB / TLS front, per config-distribution §HA ("DNS round-robin or a
  # small LB"). Terminates HTTPS on :443 and round-robins the backend pair.
  lb:
    image: nginx:alpine
    container_name: antibot-lb
    depends_on:
      - backend-1
      - backend-2
    # DEMO_BIND_IP mirrors demo-stand: set it to a per-stack IP when sharing a VM
    # so this :443 doesn't clash with the demo-stand's own :443.
    ports:
      - "${DEMO_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # [B6] auth.conf — mTLS / IP allowlist / off, selected by AUTH_MODE.
      # Default is ip-allowlist (config-distribution §Channel C fallback);
      # flip AUTH_MODE=mtls in .env once edge clients have edge-client.{crt,key}.
      - ./auth/${AUTH_MODE:-ip-allowlist}.conf:/etc/nginx/conf.d/auth.conf:ro
      # [B10] Channel C enforcement — the pair to auth.conf, applied only
      # inside `location /` (catalog/health), not on /antibot/v1/. The split
      # is needed because the server-level auth.conf runs BEFORE location
      # routing and would otherwise gate /antibot/v1/ with the same edge credential
      # (PR-58 review fix).
      # Mounted outside /etc/nginx/conf.d/ to avoid the base image's
      # `include /etc/nginx/conf.d/*.conf` wildcard — the fragments are
      # only valid inside `location /` (lb.conf:71), not on http-level.
      - ./auth/${AUTH_MODE:-ip-allowlist}-channelc.conf:/etc/nginx/auth-channelc.conf:ro
      # Only read for AUTH_MODE=ip-allowlist (mtls/off do not include it),
      # but the bind-mount is unconditional — auth/allow.list ships committed
      # with safe loopback + RFC1918 defaults so the bind always has a real
      # file as its source (Docker would otherwise create the path as an empty
      # directory and nginx `include` would fail on it).
      - ./auth/allow.list:/etc/nginx/conf.d/allow.list:ro
      # [B10] dashboard-cidr.conf — CIDR-allowlist for /antibot/v1/* (PR-58
      # audit #1). Operator copies dashboard-cidr.conf.example, fills with
      # the dashboard-backend egress CIDR. If missing, `nginx -t` fails →
      # explicit signal vs. silently-public policy API.
      #
      # Mounted outside /etc/nginx/conf.d/ for the same reason as
      # auth-channelc.conf above: contains `deny all;`, which is valid on
      # http-level but would silently block ALL traffic except the allowed
      # CIDRs across every location. Must load only inside its
      # `location /antibot/v1/` (lb.conf:55).
      - ./auth/dashboard-cidr.conf:/etc/nginx/dashboard-cidr.conf:ro
      # CIDR-allowlist for /grafana/ (the BAC log viewer UI). Same mount
      # pattern as dashboard-cidr.conf — ships committed with loopback
      # baseline; operators edit on the VM with real viewer source CIDRs.
      - ./auth/grafana-cidr.conf:/etc/nginx/grafana-cidr.conf:ro
    restart: unless-stopped

  # ─── BAC log viewer (Loki + Grafana) ────────────────────────────────────
  # Promtail on the edge VM (infra/demo-stand/) ships BAC_LOG stdout lines
  # here over HTTPS + mTLS (same edge-client cert as catalog_pull). Loki is
  # never published on the host: edge → /loki/api/v1/push via lb-nginx,
  # Grafana reads it in-network at http://loki:3100. The viewer UI is
  # served at https://<backend-host>/grafana/ behind a CIDR-allowlist
  # (auth/grafana-cidr.conf) — symmetric to the dashboard policy API.
  loki:
    image: grafana/loki:3.4.1
    container_name: antibot-loki
    # Profile-gated so the default `docker compose up -d` keeps bringing up
    # only the existing postgres / backend / lb services (the catalog +
    # policy + log-receiver path). Operators opt in to the BAC log viewer
    # with `--profile observability`.
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      # `/ready` returns 200 once the ingester is ready to accept pushes.
      # Without this Grafana's depends_on:service_healthy can't gate the
      # datasource health-check against Loki's real cold-start latency
      # (TSDB schema + index + compactor init can take ~10-20s).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    # No `ports:` — Loki is reachable only via the compose network. The
    # write path enters through the lb-nginx mTLS-gated location; the read
    # path is the in-network grafana service. Surface Loki on the host
    # only if you genuinely need direct LogCLI access — and put it behind
    # the host firewall, not on a public bind.

  grafana:
    image: grafana/grafana:11.4.0
    container_name: antibot-grafana
    profiles: ["observability"]
    depends_on:
      loki:
        condition: service_healthy
    environment:
      # Grafana sits behind the existing TLS-terminating lb-nginx at the
      # /grafana/ sub-path. With serve_from_sub_path=true Grafana itself
      # mounts at /grafana/* — so the lb proxy_pass keeps the URI prefix
      # rather than rewriting it (simpler, fewer static-asset gotchas).
      GF_SERVER_ROOT_URL: "https://${BACKEND_HOST:-antibot.internal}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Empty default (not :? required) for the same reason promtail's
      # LOKI_PUSH_URL uses :- on the edge: compose evaluates ${VAR:?}
      # at parse time regardless of whether the profile is active, so a
      # required form here would break `docker compose -f
      # docker-compose.backend.yml up -d` (the default workflow) for
      # operators who never enable the observability profile. Unset =
      # Grafana falls back to its built-in `admin/admin` default and
      # forces a password change on first login. .env.example marks this
      # as required when the profile IS enabled.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      # Don't phone home from a demo VM that may be behind a restricted egress
      # filtering — and there's nothing useful to report from this scale.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Anonymous viewer is OFF by default. Flip to true in .env if your
      # CIDR-allowlist already gates /grafana/ to trusted reviewers and you
      # want a read-only no-login UX. Defence-in-depth: the CIDR layer is
      # ALWAYS on regardless of this flag.
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_ANON:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Provisioner config (./provisioning/dashboards/bac.yaml) points the
      # dashboard provider at /var/lib/grafana/dashboards/bac — so the
      # JSON sources live there, not in /etc/grafana/.
      - ./observability/grafana/provisioning/dashboards:/var/lib/grafana/dashboards/bac:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ─── BAC analytics / blocklist-candidate producer ───────────────────────
  # Daily traffic analyzer (analyze.py), MOVED off the edge onto the backend so
  # it reads Loki (7d, all edges) instead of the edge's ~24h docker logs. Runs
  # in-network (Loki's read API is in-network only). Writes JSON artifacts to
  # the repo's state/ — consumed host-side by scripts/blocklist-autopilot.sh —
  # and emails the daily report. Producer only: it never opens PRs (that needs
  # the checkout + gh creds, kept on the host). See docs/blocklist-promotion.md.
  #
  # CRON-DRIVEN ONE-SHOT: the entrypoint runs ONE pass and exits; scheduling is
  # external (host cron at 08:00 — see the runbook), not an in-container loop.
  # Run a pass with:
  #   docker compose -f docker-compose.backend.yml --profile observability run --rm analytics
  # `restart: "no"` so an `up` of this service doesn't restart-loop on exit 0.
  analytics:
    build:
      context: ./analytics
    image: antibot-analytics:demo
    container_name: antibot-analytics
    profiles: ["observability"]
    depends_on:
      loki:
        condition: service_healthy
    environment:
      ABUSE_CONTROLS_ROOT: "/data"
      CATALOGS_DIR: "/data/catalogs"
      BAC_SOURCE: "loki"
      LOKI_URL: "http://loki:3100"
      BAC_TTL_DAYS: "${BAC_TTL_DAYS:-14}"
      BAC_MIN_STAGING_HOURS: "${BAC_MIN_STAGING_HOURS:-48}"
      # Lifetime-state rotation (D7): run.sh runs rotate-state.py before analyze.py
      # to archive the aged-out tail of seen-fps.json / ip-cache.json. Defaults
      # applied in run.sh; surfaced here so .env can override per deploy.
      STATE_FP_TTL_DAYS: "${STATE_FP_TTL_DAYS:-30}"
      STATE_IP_TTL_DAYS: "${STATE_IP_TTL_DAYS:-7}"
      STATE_COMPACT_MIN_COUNT: "${STATE_COMPACT_MIN_COUNT:-3}"
      STATE_ARCHIVE_RETENTION_MONTHS: "${STATE_ARCHIVE_RETENTION_MONTHS:-6}"
      TZ: "${TZ:-Europe/Moscow}"
      # Daily report email (Gmail SMTP). All optional: unset → artifacts still
      # written, email simply skipped. Secrets live in .env, never in the image.
      REPORT_FROM: "${REPORT_FROM:-}"
      REPORT_TO: "${REPORT_TO:-}"
      MSMTP_HOST: "${MSMTP_HOST:-}"
      MSMTP_PORT: "${MSMTP_PORT:-587}"
      MSMTP_USER: "${MSMTP_USER:-}"
      MSMTP_PASS: "${MSMTP_PASS:-}"
    volumes:
      # catalogs read-only; analyze.py only reads them for the promotion gates.
      - ../../catalogs:/data/catalogs:ro
      # analyzer + helpers (read-only).
      - ../../infra/demo-stand/scripts:/data/infra/demo-stand/scripts:ro
      # state/ + reports/ writable — artifacts land here and the host autopilot
      # (same checkout) reads state/. Both are gitignored.
      - ../../state:/data/state
      - ../../reports:/data/reports
    restart: "no"

volumes:
  pgdata:
  log-spool-1:
  log-spool-2:
  loki-data:
  grafana-data:
