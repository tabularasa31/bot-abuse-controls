# Test-only resolver override — bind-mounted over
# /etc/nginx/resolver.conf in docker-compose.test.yml. Prepends
# Docker's embedded DNS (127.0.0.11) so compose service names like
# `backend` resolve from cosockets created in ngx.timer /
# init_worker contexts (catalog_pull.lua). Public resolvers
# trail behind as a safety net for any test that may later
# resolve an external host.
resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 5s;
