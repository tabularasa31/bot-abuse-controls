# Integration test harness for the Channel C contract (B13 / D8).
#
# Minimal stack: postgres + antibot-backend + edge. Reuses the same image
# builds as infra/demo-{backend,stand}/ so what tests run matches what
# the demo VM runs. Differences vs demo composes:
#   - no HA (single backend instance; the LB layer adds nothing to the
#     contract being tested and doubles bootup time).
#   - no LB / TLS termination on backend (edge talks plain HTTP to
#     backend over the compose network).
#   - postgres on tmpfs (no persistent volume; ephemeral CI cattle).
#   - short reload + pull intervals so tests don't pay for the 30s
#     production cadence on every assertion (≤30s SLA from
#     vision.md §«Обновление каталогов» is still asserted by tests;
#     CI just gets to verify it in 3-5s instead of 30s).
#
# Edge port 18443 → host. Backend port 18080 → host. Both on loopback
# only so a CI runner with multiple parallel jobs doesn't collide.
#
# Run:
#   make test-integration           # full lifecycle (up + run.sh + down)
#   docker compose -f docker-compose.test.yml up -d --wait  # manual

name: bac-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antibot
      POSTGRES_USER: antibot
      POSTGRES_PASSWORD: testpw
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibot -d antibot"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: ../../antibot-backend
    image: antibot-backend:test
    environment:
      INSTANCE_NAME: backend-test
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://antibot:testpw@postgres:5432/antibot?sslmode=disable"
      CATALOGS_DIR: "/catalogs"
      LOGS_SINK_SPOOL_DIR: "/tmp/log-spool"
      # Short reload tick so backend picks up a /antibot/v1/policy PATCH
      # in seconds, not 5s. Combined with edge's pull_interval below,
      # makes the full "PATCH → edge applied" loop fit a 10s budget.
      CATALOG_RELOAD_INTERVAL: "1s"
      # Shared M2M secret for /antibot/v1/* (dashboard API). Hardcoded
      # here because tests need it; never use this token outside CI.
      DASHBOARD_API_TOKEN: "test-token-not-secret"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../catalogs:/catalogs:ro
    ports:
      # Loopback only — test runner on host curls policy PATCH via this.
      - "127.0.0.1:18080:8080"
    # No container-level healthcheck: the antibot-backend image is
    # distroless/static-debian12 (Dockerfile uses gcr.io/distroless/static),
    # which has no shell and no wget/curl, so CMD-SHELL probes can't
    # touch /health. Production demo-backend (infra/demo-backend) takes
    # the same shape — backend containers carry no healthcheck and the
    # LB / edge tolerate not-ready-yet via fail-stale (catalog_pull
    # retries on the next tick). Makefile test-integration target adds
    # a host-side curl poll for /health after `compose up --wait` so
    # tests don't race the backend coming up.

  edge:
    build:
      context: ../demo-stand
      dockerfile: Dockerfile
    image: bac-demo-stand:test
    environment:
      EDGE_ID: stand-test
      # Origin not exercised — tests target the read-only mgmt plane on :9090
      # (/__policy, /__stats) + the public /__health. Upstream selection is
      # Policy-driven (no ORIGIN_URL env); a non-tenant Host is dropped with 444
      # (tenant-only edge, no landing), so cases never hit `/`.
      ANTIBOT_BACKEND_URL: "http://backend:8080"
      ANTIBOT_BACKEND_SSL_VERIFY: "false"
      # B11 / D8: override the 30s pull cadence so a PATCH → edge-visible
      # round-trip fits a 5s assertion window. Production stays at 30s.
      ANTIBOT_BACKEND_PULL_INTERVAL: "2"
      BAC_DEMO_GEO_HEADER: "off"
    depends_on:
      backend:
        # Backend has no container healthcheck (distroless image has
        # no shell — see backend service notes). service_started is
        # the strongest condition we can rely on; the edge tolerates
        # a backend that's listening-but-not-ready via fail-stale,
        # and the runner verifies backend /health on host port 18080
        # before running cases.
        condition: service_started
    volumes:
      - ../demo-stand/lua:/etc/nginx/lua:ro
      - ../demo-stand/config:/etc/nginx/config:ro
      - ../demo-stand/geoip:/etc/nginx/geoip:ro
      - ../demo-stand/nginx.demo.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      # Override the production resolver.conf with a docker-DNS-aware
      # version so cosockets in ngx.timer / init_worker (catalog_pull.lua)
      # can resolve compose service names like `backend`. Same target
      # path that demo-stand mounts the production version to.
      - ./resolver.conf:/etc/nginx/resolver.conf:ro
      - ./test-certs:/etc/nginx/certs:ro
      # [C2] Same mounts the production demo-compose uses. challenge.lua's
      # preload() reads CASCADE_VERSION on init_by_lua and fails nginx start
      # without both files (mismatch or missing). Bundling them in the
      # harness keeps the init contract identical between smoke and
      # integration runs.
      - ../demo-stand/challenge:/etc/nginx/challenge:ro
      - ../demo-stand/CASCADE_VERSION:/etc/nginx/CASCADE_VERSION:ro
    ports:
      - "127.0.0.1:18443:443"
      # Private mgmt plane (read-only /__policy + /__stats). Loopback-only on the
      # runner — the B13 cases read edge state here instead of the (removed)
      # public /__policy + /metrics. Never bound to a public interface.
      - "127.0.0.1:19090:9090"
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/__health >/dev/null 2>&1 || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
