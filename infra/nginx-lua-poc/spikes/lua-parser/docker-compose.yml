# Spike 2 stand. Stays on stock openresty/openresty:alpine — no rebuild.
# Port 8453 to avoid clashing with the PoC #2 stand at 8443.
services:
  nginx-lua-parser:
    image: openresty/openresty:alpine
    container_name: nginx-lua-parser
    ports:
      - "8453:443"
    volumes:
      - ./nginx.lua.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./lua:/etc/nginx/lua:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
