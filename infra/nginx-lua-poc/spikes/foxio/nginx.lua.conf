worker_processes auto;
error_log /etc/nginx/logs/error.log info;
events { worker_connections 4096; }

http {
    access_log off;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    lua_shared_dict verdict_cache 10m;
    lua_shared_dict fp_blocklist 1m;

    init_by_lua_file /etc/nginx/lua/init.lua;

    server {
        listen 443 ssl;
        http2 on;
        server_name antibot.local localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # FoxIO module hooks here.
        ssl_ja4 on;

        location / {
            access_by_lua_file /etc/nginx/lua/verdict.lua;
            content_by_lua_block { ngx.print("ok\n") }
        }
        location = /__health { return 200 "ok\n"; }
        location = /__fp     { content_by_lua_file /etc/nginx/lua/probe.lua; }
    }
}
