worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;

events { worker_connections 4096; }

http {
    access_log off;  # PoC: disable for wrk noise reduction

    # Make Lua modules importable via `require "blocklist"` etc.
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Hot path cache (per-fingerprint verdict). TTL set in verdict.lua.
    lua_shared_dict verdict_cache 10m;
    # Static blocklist loaded once at init.
    lua_shared_dict fp_blocklist 1m;

    init_by_lua_file /etc/nginx/lua/init.lua;

    server {
        listen 443 ssl;
        http2 on;
        server_name antibot.local localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Allow path: respond from nginx (no upstream) to isolate Lua
        # verdict cost from any HTTP-proxying overhead. See plan §2.5.
        # NB: cannot use `return 200` here — it finalizes the request in
        # the rewrite phase, before access_by_lua runs. Use content_by_lua
        # instead so the access phase actually executes.
        location / {
            access_by_lua_file  /etc/nginx/lua/verdict.lua;
            content_by_lua_block { ngx.print("ok\n") }
        }

        # Health check — bypasses the verdict pipeline.
        location = /__health {
            return 200 "ok\n";
        }

        # Debug endpoint — dumps the synthetic fingerprint so the
        # probe script can capture it. Bypasses verdict.
        location = /__fp {
            content_by_lua_file /etc/nginx/lua/probe.lua;
        }
    }
}
