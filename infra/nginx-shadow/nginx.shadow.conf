# Shadow-mode antibot reverse proxy.
#
# Pipeline per request:
#   1. TLS terminate
#   2. access_by_lua  → verdict.lua: compute fp, lookup blocklist, stash
#                       verdict in ngx.ctx. NEVER calls ngx.exit(403).
#   3. proxy_pass     → upstream backend (the real site)
#   4. log_by_lua     → log_event.lua: emits one JSON line to stderr/log
#                       per request with fp + would-be verdict + timings
#
# To convert to ACTIVE (real blocking) later: swap the access_by_lua_file
# to the PoC one at infra/nginx-lua-poc/lua/verdict.lua (which does
# ngx.exit(403) on block verdict). No other change needed.

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log notice;
# ↑ NOTICE level so log_event.lua's ANTIBOT_EVENT lines show up. Switch
#   to INFO if you also want the per-request debug log lines from
#   verdict.lua. Switch to WARN to drop NOTICE-level antibot events
#   entirely (use for steady-state production, NOT for shadow data collection).

events { worker_connections 4096; }

http {
    # Standard access log to stdout in case you want to correlate; the
    # shadow ANTIBOT_EVENT lines have more detail and go via error log.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /usr/local/openresty/nginx/logs/access.log main;

    lua_package_path "/etc/nginx/lua/?.lua;/etc/nginx/lua-common/?.lua;;";

    # Hot path cache (per-fp verdict). Sized for ~100K distinct fps;
    # adjust upward if shadow logs show higher cardinality.
    lua_shared_dict verdict_cache 10m;
    # Static blocklist loaded once at init.
    lua_shared_dict fp_blocklist 1m;

    init_by_lua_file /etc/nginx/lua/init.lua;

    # ---- Upstream(s) ----
    # Customise the upstream block(s) for your real backend(s). One per
    # site you put behind shadow. Listening multiple TLS sites on the
    # same nginx is supported via multiple server{} blocks below.
    upstream backend_default {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # ---- Example server block ----
    # Duplicate this server{} block per site you want to shadow-protect.
    # Update server_name, ssl_certificate*, and proxy_pass for each.
    server {
        listen 443 ssl;
        http2 on;
        # SET TO YOUR DOMAIN(S):
        server_name _;

        # SET TO YOUR REAL CERT PATHS:
        #   - If you use Let's Encrypt:    /etc/letsencrypt/live/<domain>/fullchain.pem
        #   - If you provision via CDN operator / commercial CA: bind-mount appropriately
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Required for $ssl_ciphers to be populated meaningfully on
        # session reuse — without this nginx caches the *negotiated*
        # cipher only.
        ssl_session_cache   shared:SSL:50m;

        # Antibot shadow pipeline.
        location / {
            access_by_lua_file  /etc/nginx/lua/verdict.lua;
            proxy_pass          http://backend_default;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";
            # log_by_lua runs AFTER proxy_pass completes — we have
            # upstream timing + final status available.
            log_by_lua_file     /etc/nginx/lua/log_event.lua;
        }

        # Health check — bypasses antibot pipeline so liveness probes
        # don't pollute the shadow log.
        location = /__health {
            return 200 "ok\n";
        }

        # Debug fp endpoint — same as PoC. Useful to manually test from
        # browser to see what fp your client produces against this
        # specific nginx build / OpenSSL.
        location = /__fp {
            content_by_lua_file /etc/nginx/lua-common/probe.lua;
        }
    }
}
