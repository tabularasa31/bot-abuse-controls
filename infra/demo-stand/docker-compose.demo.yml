# Demo-stand compose. Single openresty container, active blocking
# pipeline, multi-scenario endpoints. See ./README.md for setup.

services:
  nginx-demo:
    # Built image = stock openresty/openresty:alpine + libmaxminddb (for the
    # A6 GeoLite2 FFI lookup). See ./Dockerfile. Rebuild with `--build` after
    # changing the Dockerfile; Lua/config are bind-mounted so code edits still
    # just need a reload.
    build:
      context: .
      dockerfile: Dockerfile
    image: bac-demo-stand:local
    container_name: nginx-demo
    restart: unless-stopped
    # Raise the open-file-descriptor limit. nginx.demo.conf sets
    # `worker_connections 4096`, but each connection (plus listen sockets,
    # upstream sockets, log/shm files) is an fd, and Docker's default
    # RLIMIT_NOFILE is 1024 — so without this the real ceiling is ~1024 and
    # nginx warns at start ("worker_connections exceed open file resource
    # limit"). 65535 gives 4096 connections comfortable headroom.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # REVISION appears in the EDGE_STATS dump (`commit` field). Override with a
    # real git sha on deployment:
    #   REVISION=$(git rev-parse --short HEAD) docker compose -f \
    #       infra/demo-stand/docker-compose.demo.yml up -d
    # ${REVISION:-dev} also requires the env-var listing inside nginx
    # (see nginx.demo.conf: `env REVISION;` at the top).
    environment:
      REVISION: ${REVISION:-dev}
      # edge_id stamped into every BAC log record (see bac_log.lua).
      EDGE_ID: ${EDGE_ID:-stand-bac}
      # Upstream selection is fully Policy-driven (ClickUp 86exrefdz): a tenant
      # is a host whose Policy (Channel C) has a non-empty origin_ip; the edge
      # proxies the incoming Host to that IP, everything else is dropped with 444
      # (tenant-only edge). No ORIGIN_URL / DASHBOARD_* env — add a tenant with
      # one PATCH /antibot/v1/policy/<host> {"origin_ip": ...}.
      # When "on", reputation.lua honours an X-Demo-IP request header to
      # simulate a public client IP for GeoIP lookups (stand testing). Default
      # off → real remote_addr is always used (organic traffic resolves for
      # real on the VM). See README "GeoIP / A6".
      BAC_DEMO_GEO_HEADER: ${BAC_DEMO_GEO_HEADER:-off}
      # Where geoip.lua looks for the GeoLite2 .mmdb files inside the container.
      # Defaults to the mount point below; override only if you also remount.
      BAC_GEOIP_DIR: ${BAC_GEOIP_DIR:-/etc/nginx/geoip}
      # [B6] Channel C backend URL + optional mTLS client cert. ANTIBOT_BACKEND_URL
      # unset → catalog_pull skips the timer (static seed only). For mTLS, drop
      # edge-client.{crt,key} into ./certs (already mounted) and set both paths.
      ANTIBOT_BACKEND_URL: ${ANTIBOT_BACKEND_URL:-}
      ANTIBOT_BACKEND_HOST: ${ANTIBOT_BACKEND_HOST:-}
      ANTIBOT_BACKEND_CLIENT_CERT: ${ANTIBOT_BACKEND_CLIENT_CERT:-}
      ANTIBOT_BACKEND_CLIENT_KEY: ${ANTIBOT_BACKEND_CLIENT_KEY:-}
      # Set to "false" in .env when the backend uses a self-signed cert that
      # wouldn't validate against the container's CA bundle (typical for our
      # demo-backend on a side VM). Default unset → catalog_pull keeps
      # ssl_verify=true (production-path).
      ANTIBOT_BACKEND_SSL_VERIFY: ${ANTIBOT_BACKEND_SSL_VERIFY:-}
      # NOTE: DASHBOARD_API_TOKEN / ADMIN_ACL_CIDR were removed (Phase 1) —
      # the /__admin recovery endpoint they gated is gone; false-positive
      # recovery is the dashboard's job via the Policy API.
      # On-demand TLS (lua-resty-auto-ssl) for tenant custom domains.
      #   STAND_BASE_DOMAIN — names at/under it use the static fallback cert,
      #     never ACME (default example.com).
      #   AUTO_SSL_STAGING — "true" while bringing it up (LE staging CA, certs
      #     are UNTRUSTED but rate limits are high). Flip to unset/false for
      #     real browser-trusted certs once the http-01 path is verified.
      STAND_BASE_DOMAIN: ${STAND_BASE_DOMAIN:-example.com}
      AUTO_SSL_DIR: /etc/resty-auto-ssl
      AUTO_SSL_STAGING: ${AUTO_SSL_STAGING:-}
      # Email for the Let's Encrypt account (recommended; expiry notices).
      ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-}
    ports:
      # Bind host. Default 0.0.0.0 (all interfaces). On a VM that already
      # runs another service on :80/:443, set DEMO_BIND_IP to the demo's
      # dedicated IP (the one the public/floating IP NATs to) in a local
      # .env so the bind doesn't clash. .env is gitignored.
      - "${DEMO_BIND_IP:-0.0.0.0}:443:443"
      - "${DEMO_BIND_IP:-0.0.0.0}:80:80"   # 80 reserved for ACME http-01 challenge
      # Private mgmt plane (read-only /__policy + /__stats). MUST stay bound to
      # 127.0.0.1 — NEVER ${DEMO_BIND_IP} or the public/floating IP. This bind is
      # the ONLY access control for the plane (nginx can't ACL it under docker
      # NAT — see nginx.demo.conf :9090 block); publishing it on a public
      # interface leaks per-host policy incl. tenant origin_ip. Operator reaches
      # it via SSH tunnel: `ssh -L 9090:127.0.0.1:9090 <vm>` → http://localhost:9090.
      - "127.0.0.1:9090:9090"

    volumes:
      - ./nginx.demo.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      # http-level resolver, included from nginx.demo.conf. Production
      # default = public DNS. Integration harness bind-mounts a
      # docker-DNS-aware version over the same path inside
      # infra/test-harness/docker-compose.test.yml so it can resolve
      # compose service names from timer-context cosockets.
      - ./resolver.conf:/etc/nginx/resolver.conf:ro
      # Cascade Lua: stage modules + shared fp compute
      # (ja4_compute + ja4_helpers; the source of truth now lives here too).
      - ./lua:/etc/nginx/lua:ro
      # Cascade config files (defaults + IP/UA/ASN/fp catalogs), read once
      # at init_by_lua via the `config` Lua module. Editing a file here and
      # restarting the container re-applies it (hot-reload is a separate task).
      - ./config:/etc/nginx/config:ro
      - ./certs:/etc/nginx/certs:ro
      # [C2] Phase 4 challenge page asset. Channel A on the demo = file
      # mount (Puppet on prod). Read once in init_by_lua via challenge.lua;
      # change = bump CASCADE_VERSION + edit page.html + `openresty -s
      # reload`. See infra/demo-stand/challenge/README.md.
      - ./challenge:/etc/nginx/challenge:ro
      # Cascade version pin. challenge.lua compares this value with
      # <meta name="cascade-version"> in the template at init_by_lua; a mismatch
      # fails the start — protection against the template and the Lua cascade drifting apart.
      - ./CASCADE_VERSION:/etc/nginx/CASCADE_VERSION:ro
      # GeoLite2 databases for the A6 geo/ASN lookup. License-gated, NOT
      # committed — populate with scripts/fetch-geoip.sh. If empty the stand
      # still starts (geoip.lua fail-open); geo is just undetermined.
      - ./geoip:/etc/nginx/geoip:ro
      # On-demand TLS cert storage (lua-resty-auto-ssl). Named volume so
      # issued Let's Encrypt certs survive restarts — re-issuing on every
      # restart would quickly hit LE rate limits. Writable by the worker
      # user (nobody); the image chowns it at build.
      - auto-ssl-storage:/etc/resty-auto-ssl
    # Log via the default json-file driver — fine for the demo. Real
    # production would point to a log aggregator (Loki / fluentd / etc.).
    # Promtail below ships the BAC_LOG stream off to the backend Loki when
    # the `observability` profile is enabled.

  # Ships BAC_LOG records from nginx-demo's stdout to the antibot-backend's
  # Loki (via the LB-nginx mTLS gate). Behind `profiles: [observability]`
  # so `docker compose up` with no flags brings up only nginx-demo, as it
  # does today — that preserves the stand's old workflow. To ship logs:
  #   LOKI_PUSH_URL=https://<backend>/loki/api/v1/push docker compose \
  #     -f docker-compose.demo.yml --profile observability up -d
  #
  # The mTLS material is the same edge-client.{crt,key} catalog_pull
  # uses — no new cert distribution channel.
  promtail:
    image: grafana/promtail:3.4.1
    container_name: promtail
    profiles: ["observability"]
    depends_on:
      - nginx-demo
    # Two-stage entrypoint:
    #  1. Preflight that refuses to start with an empty LOKI_PUSH_URL.
    #     The compose env can't use the ${VAR:?…} required form (it's
    #     evaluated at parse time, BEFORE profile filtering — would
    #     break the no-profile default workflow), so the check happens
    #     here at runtime with a memorable FATAL line. The `sleep 5`
    #     keeps the restart-loop from hammering the docker daemon and
    #     fills `docker logs promtail` with one clear message per cycle
    #     instead of a torrent of cryptic promtail parse errors.
    #  2. `exec` the real promtail with -config.expand-env=true so
    #     ${LOKI_PUSH_URL} / ${LOKI_PUSH_INSECURE_TLS} in promtail-config
    #     are substituted from the compose env. drone/envsubst (which
    #     promtail uses internally) supports the bash `${VAR:-default}`
    #     form — that's how LOKI_PUSH_INSECURE_TLS defaults to true.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$LOKI_PUSH_URL" ]; then
          echo 'FATAL: LOKI_PUSH_URL is empty — set it in .env when --profile observability is active' >&2
          sleep 5
          exit 1
        fi
        exec /usr/bin/promtail -config.file=/etc/promtail/config.yaml -config.expand-env=true
    environment:
      # Empty default lets the no-profile parse path succeed. The
      # preflight above turns "operator forgot to set this" into a
      # visible unhealthy state instead of a silent crash-loop.
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-}
      # The backend in demo runs with a self-signed cert; flip to false
      # once you mount a backend-CA bundle as a trust root (prod path).
      LOKI_PUSH_INSECURE_TLS: ${LOKI_PUSH_INSECURE_TLS:-true}
    healthcheck:
      # The grafana/promtail image ships without wget/curl/nc, so the
      # previous wget-based probe always returned 127 and flagged the
      # container as unhealthy even when it was working fine. Bash IS
      # present and supports the /dev/tcp/<host>/<port> pseudo-device,
      # which gives a portable TCP-handshake probe with zero external
      # tooling. A successful connect = promtail finished parsing its
      # config and the HTTP server is listening (the preflight exit and
      # config-parse failures both happen BEFORE the port binds), which
      # is the signal we care about.
      #
      # `2>/dev/null` swallows bash's "connect: Connection refused"
      # line during start-up / restart-loop probes — without it every
      # failed probe writes one line to docker logs. FD 3 stays open
      # only until bash exits at the end of the -c, so no explicit
      # close is needed (kernel reaps it on process exit).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9080 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      # docker_sd_configs needs read access to the docker daemon to
      # enumerate the nginx-demo container and follow its log stream.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Reuse the existing edge-client mTLS material — same cert/key
      # catalog_pull already uses (install-edge-client-cert.sh writes
      # into ./certs/).
      - ./certs:/etc/promtail/certs:ro
      # WAL + positions survive container restarts in a named volume so
      # promtail can resume from the last shipped offset instead of
      # re-shipping (or worse, missing) the tail on every restart.
      - promtail-data:/var/lib/promtail
    restart: unless-stopped

volumes:
  promtail-data:
  # lua-resty-auto-ssl issued-cert storage (on-demand TLS for tenant custom
  # domains). Persisted so certs + the ACME account key survive restarts.
  auto-ssl-storage:
