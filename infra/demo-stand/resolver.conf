# http-level resolver, included from nginx.demo.conf. Production-default
# values: public DoH-anycast addresses + IPv4-only. Catalogs are pulled
# from antibot-backend by FQDN at production; ANTIBOT_BACKEND_HOST in
# .env names a hostname these resolvers can reach.
#
# Integration harness (infra/test-harness/docker-compose.test.yml) bind-
# mounts a different file over this same path that prepends 127.0.0.11
# (Docker's embedded DNS), so compose service names like `backend`
# resolve from inside the edge container. That override is contained to
# the test environment — production never queries 127.0.0.11.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;
