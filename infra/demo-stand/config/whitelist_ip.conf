# whitelist_ip.conf — системный IP-whitelist (Phase 1+).
# См. docs/product/config-templates.md §2.
#
# Список IP / CIDR нашего мониторинга, чек-сервисов, доверенных системных
# клиентов. Используется правилом ip_whitelist (категория allow).
# Изменения — через PR.
#
# Формат: одна запись на строку — <ip-or-cidr>  # комментарий.
#
# Пуст на старте демо-стенда: реальных мониторинговых подсетей у стенда нет,
# наполняется по мере подключения. Примеры формата (из шаблона):
#
# 10.0.1.0/24      # мониторинговая подсеть
# 10.0.2.5         # health-checker
# 69.162.124.0/24  # UptimeRobot (с письменным согласованием)
# 63.143.42.0/24   # UptimeRobot
