# whitelist_ip.conf — the system IP whitelist.
# See docs/product/config-templates.md §2.
#
# The list of IPs / CIDRs of our monitoring, check services and trusted system
# clients. Used by the ip_whitelist rule (allow category).
# Changes go through a PR.
#
# Format: one entry per line — <ip-or-cidr>  # comment.
#
# Empty at the start of the demo stand: the stand has no real monitoring subnets,
# it is filled as they are connected. Format examples (from the template):
#
# 10.0.1.0/24      # monitoring subnet
# 10.0.2.5         # health-checker
# 69.162.124.0/24  # UptimeRobot (with written approval)
# 63.143.42.0/24   # UptimeRobot
