# tls_fp_catalog.conf — сигнатуры автоматизации для impersonator-детекции (Phase 2+).
# См. docs/product/config-templates.md §7.
#
# Пуст на старте. Map hash_b -> семейство автоматизации. Используется
# правилом tls_fp_impersonator (категория soft). Наполняется через PR,
# через staged rollout.
#
# Формат (секционный, как в defaults.conf): секция [<hash_b>] + атрибуты.
#
# Примеры (после первых PR):
# [1ed0482b9b4c]
# family = python-requests
# status = active
# added = 2026-07-01
# pr = #96
#
# [a1b2c3d4e5f6]
# family = curl
# status = staging
# added = 2026-07-20
# pr = #108
