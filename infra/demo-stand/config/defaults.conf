# defaults.conf — the base cascade config (Phase 1+).
#
# The main config; the cascade will not start without it. The structure mirrors
# docs/product/config-templates.md §1; instead of the illustrative YAML, this file uses
# a sectioned (INI-like) syntax — config_loader.lua parses it into the
# same nested table. A rule category is set by its SECTION ([blocking.*],
# [allow.*], [soft.*]), not by a separate attribute.
#
# Dotted section names set the nesting: [blocking.rate_ip] => root.blocking.rate_ip.
# Values containing commas are parsed as a list; purely numeric ones as a number.
#
# The Phase 1 content is a structural placeholder: the rules themselves (rate_limits,
# the IP checks, the hygiene check) are implemented by separate tasks and read
# these values from the config module. tls_fp_*/cookie/bot_verified are marked with
# the phase in which they become active.

# --- L1 Hygiene -----------------------------------------------------------
[hygiene]
# Full set of standard REST verbs — tenants behind the edge serve mutating APIs
# (PATCH/PUT/DELETE), so restricting to read+POST 403s legitimate API traffic at
# the edge before it reaches origin. TRACE/CONNECT stay off the list (blocked).
method_whitelist = GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS
# What counts as an "API endpoint" for the rate_api rule.
api_path_patterns = /api/*, /graphql

# --- blocking category — the rules that emit verdict=block ----------------
[blocking.method_not_allowed]
stage = hygiene
source = built-in

[blocking.ua_blacklist]
stage = hygiene
source = ua_blacklist.conf
enabled = true

[blocking.ip_blocklist]
stage = reputation
source = blocklist_ip.conf
enabled = true

[blocking.asn_customer]
stage = reputation
source = policy[host].asn_block
enabled = true

[blocking.geo_blocklist]
stage = reputation
source = policy[host].geo_whitelist
enabled = true

# Phase 2+
[blocking.tls_fp_blocklist]
stage = tls_fp
source = tls_fp_blocklist.conf
enabled = true

[blocking.rate_ip]
stage = rate_limits
key = ip
window_10s = 100
window_60s = 600

[blocking.rate_ip_ua]
stage = rate_limits
key = ip+ua
window_10s = 100
window_60s = 600

[blocking.rate_api]
stage = rate_limits
key = ip
paths = ${hygiene.api_path_patterns}
window_10s = 50
window_60s = 300

# Phase 2+
[blocking.rate_tls_fp]
stage = rate_limits
key = tls_fp
window_10s = 50
window_60s = 300
fallback = skip

[blocking.rate_scan_urls]
stage = rate_limits
key = ip
metric = unique_urls
window_10s = 50
window_60s = 200

# Phase 4+
[blocking.non_browser_blocked]
stage = verification
source = built-in

# --- allow category — the rules that emit verdict=allow (fastpath) --------
# Phase 4+ — HMAC verify, not a lookup.
[allow.cookie_valid]
stage = reputation
source = built-in
cookie_name = tf_clearance
secret_source = challenge_secret
ttl_seconds_normal = 86400
ttl_seconds_under_attack = 3600

# Phase 4 — the challenge page (C2). nonce_ttl_seconds controls the validity
# window of the self-signed nonce injected into the HTML+JS template;
# replay protection per vision §5.2 comes from the expiry inside the signed
# payload, not from server-side tracking.
[challenge]
nonce_ttl_seconds = 60

# Phase 3+ — a lookup in the catalog.
[allow.bot_verified]
stage = reputation
source = catalog.bot_verification_status
ua_pattern = Googlebot|bingbot|YandexBot|DuckDuckBot
provisional_pending = true

[allow.ip_whitelist]
stage = reputation
# The system whitelist_ip.conf plus the per-resource policy[host].ip_whitelist (Phase 3+).
source = whitelist_ip.conf

# --- soft category — the rules that accumulate the challenge flag ---------
# Phase 2+
[soft.tls_fp_impersonator]
stage = tls_fp
source = tls_fp_catalog.conf

# Phase 2+
[soft.tls_fp_suspicious_ciphers]
stage = tls_fp
source = tls_fp_browser_profiles.conf

# --- Informational tags (not rules, emit no verdict) ----------------------
[tags.reputation_asn_dc]
id = reputation:asn_dc
stage = reputation
source = asn_datacenters.conf

# Phase 2+
[tags.tls_fp_automation_ua]
id = tls_fp:automation_ua
stage = tls_fp
source = built-in

# Phase 2+
[tags.tls_fp_no_sni]
id = tls_fp:no_sni
stage = tls_fp
source = built-in

# Phase 2+
[tags.tls_fp_dc_browser]
id = tls_fp:dc_browser
stage = tls_fp
source = built-in

# --- Kill switches, for incidents -----------------------------------------
# global disables the whole cascade; per_stage disables one layer.
# Nothing is enabled by default.
# This is the baseline in git. On the stand the operator flips the levers without editing this
# file and without a redeploy: the gitignored kill_switch.local.conf (see the .example next to it)
# overrides the values below and is applied by `nginx -s reload` (A12).
[kill_switch.global]
enabled = false

[kill_switch.per_stage]
hygiene = false
reputation = false
# C3 L2.1 clearance cookie verify — a separate per-stage gate. It is not folded
# under reputation, because disabling reputation would also take out
# ip_blocklist/ip_whitelist; on a regression in lua-resty-openssl or
# clearance.verify the operator needs to kill L2.1 alone.
clearance = false
tls_fp = false
rate_limits = false
verification = false

# attack_mode is per-host only (policy[host].attack_mode). There is no global
# toggle for the whole pool; for infrastructure-level incidents, use kill_switch.

# --- Protecting the edge's own IP ------------------------------------------
# The edge is tenant-only: a non-customer Host ($origin == "" — Host: <edge-IP>, garbage,
# HTTP/1.0 with no Host) is ALWAYS dropped with `return 444` in location / (the landing page
# was removed, there is nothing to serve). deny_nontenant adds a SECOND, earlier
# layer: TLS (tls_autossl.reject_unknown_sni in ssl_certificate_by_lua) aborts the
# handshake for an SNI that is neither a tenant nor the base domain (and for no-SNI), before HTTP —
# which also saves the handshake's asymmetric crypto under an L7 flood against the edge IP.
# Tenant traffic ($origin != "") is untouched; /__health (plus ACME on :80)
# are separate locations and are likewise untouched (their base-domain SNI is deliberately let
# through the handshake). The rest of the operations surface is on the private :9090.
# The operator flips this through kill_switch.local.conf + `nginx -s reload` (like the
# kill switch, A12); false by default (TLS reject off).
[edge_protection]
deny_nontenant = false
