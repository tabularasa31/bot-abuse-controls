# defaults.conf — базовый конфиг каскада (Phase 1+).
#
# Главный конфиг, без которого каскад не запускается. Структура повторяет
# docs/product/config-templates.md §1; вместо иллюстративного YAML здесь
# секционный (INI-подобный) синтаксис — config_loader.lua разбирает его в
# тот же nested-table. Категория правила задаётся СЕКЦИЕЙ ([blocking.*],
# [allow.*], [soft.*]), а не отдельным атрибутом.
#
# Дотовая нотация секций задаёт вложенность: [blocking.rate_ip] => root.blocking.rate_ip.
# Значения с запятыми разбираются в список; чисто числовые — в number.
#
# Phase 1 наполнение — заглушка структуры: сами правила (rate_limits,
# IP-проверки, hygiene-чек) реализуются отдельными задачами и читают
# эти значения из модуля config. tls_fp_*/cookie/bot_verified помечены
# фазами, когда они активируются.

# --- L1 Hygiene -----------------------------------------------------------
[hygiene]
method_whitelist = GET, HEAD, POST, OPTIONS
# Что считать «API-эндпоинтом» для правила rate_api.
api_path_patterns = /api/*, /graphql

# --- Категория blocking — правила, эмитящие verdict=block -----------------
[blocking.method_not_allowed]
stage = hygiene
source = built-in

[blocking.ua_blacklist]
stage = hygiene
source = ua_blacklist.conf
enabled = true

[blocking.ip_blocklist]
stage = reputation
source = blocklist_ip.conf
enabled = true

[blocking.asn_customer]
stage = reputation
source = policy[host].asn_block
enabled = true

[blocking.geo_blocklist]
stage = reputation
source = policy[host].geo_whitelist
enabled = true

# Phase 2+
[blocking.tls_fp_blocklist]
stage = tls_fp
source = tls_fp_blocklist.conf
enabled = true

[blocking.rate_ip]
stage = rate_limits
key = ip
window_10s = 100
window_60s = 600

[blocking.rate_ip_ua]
stage = rate_limits
key = ip+ua
window_10s = 100
window_60s = 600

[blocking.rate_api]
stage = rate_limits
key = ip
paths = ${hygiene.api_path_patterns}
window_10s = 50
window_60s = 300

# Phase 2+
[blocking.rate_tls_fp]
stage = rate_limits
key = tls_fp
window_10s = 50
window_60s = 300
fallback = skip

[blocking.rate_scan_urls]
stage = rate_limits
key = ip
metric = unique_urls
window_10s = 50
window_60s = 200

# Phase 4+
[blocking.non_browser_blocked]
stage = verification
source = built-in

# --- Категория allow — правила, эмитящие verdict=allow (fastpath) ---------
# Phase 4+ — HMAC verify, не lookup.
[allow.cookie_valid]
stage = reputation
source = built-in
cookie_name = tf_clearance
secret_source = challenge_secret
ttl_seconds_normal = 86400
ttl_seconds_under_attack = 3600

# Phase 4 — challenge page (C2). nonce_ttl_seconds управляет окном
# годности self-signed nonce, подставляемого в HTML+JS-шаблон;
# replay-защита по vision §5.2 — через expiry внутри подписанного
# payload, не через server-side tracking.
[challenge]
nonce_ttl_seconds = 60

# Phase 3+ — lookup в каталоге.
[allow.bot_verified]
stage = reputation
source = catalog.bot_verification_status
ua_pattern = Googlebot|bingbot|YandexBot|DuckDuckBot
provisional_pending = true

[allow.ip_whitelist]
stage = reputation
# Системный whitelist_ip.conf + per-resource policy[host].ip_whitelist (Phase 3+).
source = whitelist_ip.conf

# --- Категория soft — правила, накапливающие challenge-flag ---------------
# Phase 2+
[soft.tls_fp_impersonator]
stage = tls_fp
source = tls_fp_catalog.conf

# Phase 2+
[soft.tls_fp_suspicious_ciphers]
stage = tls_fp
source = tls_fp_browser_profiles.conf

# --- Информационные теги (не правила, не эмитят verdict) ------------------
[tags.reputation_asn_dc]
id = reputation:asn_dc
stage = reputation
source = asn_datacenters.conf

# Phase 2+
[tags.tls_fp_automation_ua]
id = tls_fp:automation_ua
stage = tls_fp
source = built-in

# Phase 2+
[tags.tls_fp_no_sni]
id = tls_fp:no_sni
stage = tls_fp
source = built-in

# Phase 2+
[tags.tls_fp_dc_browser]
id = tls_fp:dc_browser
stage = tls_fp
source = built-in

# --- Kill-switch — выключатели на случай инцидентов -----------------------
# global выключает каскад целиком; per_stage — отдельный слой.
# По умолчанию ничего не активировано.
# Это baseline в git. На стенде оператор переключает рычаги без правки этого
# файла и без передеплоя: gitignored kill_switch.local.conf (см. .example рядом)
# переопределяет значения ниже, применяется по `nginx -s reload` (A12).
[kill_switch.global]
enabled = false

[kill_switch.per_stage]
hygiene = false
reputation = false
# C3 L2.1 clearance cookie verify — отдельный per-stage гейт. Не свернут
# под reputation, потому что выключение reputation выпиливает и
# ip_blocklist/ip_whitelist; при regression в lua-resty-openssl или
# clearance.verify оператору нужно потушить только L2.1.
clearance = false
tls_fp = false
rate_limits = false
verification = false

# attack_mode — только per-host (policy[host].attack_mode). Глобального
# тоггла на весь пул нет; для инфра-уровня инцидентов — kill_switch.

# --- Защита собственного IP эджа ------------------------------------------
# deny_nontenant=true включает два дополняющих слоя против L7-флуда по IP эджа:
#   * TLS (tls_autossl.reject_unknown_sni в ssl_certificate_by_lua): handshake
#     с SNI, который не тенант и не base-domain, обрывается до HTTP.
#   * HTTP (location /): запрос на не-клиентский Host ($origin == "" —
#     Host: <edge-IP>, мусор, HTTP/1.0 без Host, no-SNI) → `return 444` ДО
#     каскада, вместо рендера landing.
# Тенантский трафик ($origin != "") не затрагивается; служебная точка
# /__health (+ ACME на :80) — отдельные location, тоже не затрагиваются
# (их SNI base-domain пропускается на handshake специально). Остальная
# эксплуатация — на приватном :9090, не на публичном :443.
# Оператор щелкает через kill_switch.local.conf + `nginx -s reload` (как
# kill-switch, A12); по умолчанию false, чтобы стенд работал из коробки.
[edge_protection]
deny_nontenant = false
