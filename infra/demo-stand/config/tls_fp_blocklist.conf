# tls_fp_blocklist.conf — TLS-fingerprint blocklist (Phase 2+).
# See docs/product/config-templates.md §6.
#
# Empty at the start. Filled through PRs, via staged rollout.
# The demo stand's source of truth for the tls_fp_blocklist shared_dict: init.lua loads
# the entries with status=active (or with no status) from here and blocks them in verdict.lua.
# An empty file => SHADOW (nothing is blocked) — the stand's current mode.
#
# Format: <fp-string>  status=staging|active  added=<date>  reason=<short>  pr=<link>
#
# Examples (after the first PRs):
# L12d11h1_abc123def456_xyz789  status=active   added=2026-07-01  reason=scrapy-3.x   pr=#94
# L13d15h2_qweasdzxc987_lmnopq  status=staging  added=2026-07-15  reason=newly-seen   pr=#102
