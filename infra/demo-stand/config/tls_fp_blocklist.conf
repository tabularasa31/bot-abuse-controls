# tls_fp_blocklist.conf — TLS-fingerprint blocklist (Phase 2+).
# См. docs/product/config-templates.md §6.
#
# Пуст на старте. Наполняется через PR, через staged rollout.
# Источник истины демо-стенда для shared_dict fp_blocklist: init.lua грузит
# отсюда записи со status=active (или без status) и блокирует их в verdict.lua.
# Пустой файл => SHADOW (ничего не блокируется) — текущий режим стенда.
#
# Формат: <fp-string>  status=staging|active  added=<date>  reason=<short>  pr=<link>
#
# Примеры (после первых PR):
# L12d11h1_abc123def456_xyz789  status=active   added=2026-07-01  reason=scrapy-3.x   pr=#94
# L13d15h2_qweasdzxc987_lmnopq  status=staging  added=2026-07-15  reason=newly-seen   pr=#102
