# ua_blacklist.conf — UA patterns.
# See docs/product/config-templates.md §4.
#
# Empty at the start. Filled through PRs based on analysis of the top UAs
# in the logs. Used by the ua_blacklist rule (blocking category).
# Supports staged rollout.
#
# Format: <regex-pattern>  status=staging|active  added=<date>  reason=<short>  pr=<link>
# The pattern is the first whitespace-separated token, so the regex must not
# contain spaces (use \s, [[:space:]] and so on).
#
# Examples (after the first PRs):
# (?i)\bsqlmap/[\d.]+   status=active   added=2026-06-01  reason=SQL-scanner   pr=#48
# (?i)\bAhrefsBot\b     status=staging  added=2026-06-15  reason=SEO-crawler   pr=#80

# --- Seed: unambiguous scanners / bad bots (status=active). Honest UAs,
# --- zero business value, no false-positive risk for real users. In shadow
# --- the hygiene stage only logs (verdict=block, rule=ua_blacklist), no 403.
(?i)\bzgrab\b        status=active  added=2026-05-21  reason=zmap-internet-scanner
(?i)\bl9scan\b       status=active  added=2026-05-21  reason=leakix-scanner
(?i)\bsqlmap\b       status=active  added=2026-05-21  reason=sqli-scanner
(?i)\bnikto\b        status=active  added=2026-05-21  reason=vuln-scanner
(?i)\bmasscan\b      status=active  added=2026-05-21  reason=port-scanner
(?i)\bnuclei\b       status=active  added=2026-05-21  reason=vuln-scanner
(?i)\bwpscan\b       status=active  added=2026-05-21  reason=wordpress-scanner
(?i)\bAhrefsBot\b    status=active  added=2026-05-21  reason=seo-crawler
(?i)\bSemrushBot\b   status=active  added=2026-05-21  reason=seo-crawler
(?i)\bMJ12bot\b      status=active  added=2026-05-21  reason=crawler
(?i)\bDotBot\b       status=active  added=2026-05-21  reason=crawler
