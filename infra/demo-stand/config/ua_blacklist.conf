# ua_blacklist.conf — UA-паттерны (Phase 1+).
# См. docs/product/config-templates.md §4.
#
# Пуст на старте. Наполняется через PR по результатам анализа топа UA
# в логах. Используется правилом ua_blacklist (категория blocking).
# Поддерживает staged rollout.
#
# Формат: <regex-pattern>  status=staging|active  added=<date>  reason=<short>  pr=<link>
# Паттерн — первый whitespace-разделённый токен, поэтому regex не должен
# содержать пробелов (используйте \s, [[:space:]] и т.п.).
#
# Примеры (после первых PR):
# (?i)\bsqlmap/[\d.]+   status=active   added=2026-06-01  reason=SQL-scanner   pr=#48
# (?i)\bAhrefsBot\b     status=staging  added=2026-06-15  reason=SEO-crawler   pr=#80
