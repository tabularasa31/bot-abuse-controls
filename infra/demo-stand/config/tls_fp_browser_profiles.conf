# tls_fp_browser_profiles.conf — ожидаемые cipher_cnt для браузеров (Phase 2+).
# См. docs/product/config-templates.md §8.
#
# Заполнен базовым набором. Используется правилом tls_fp_suspicious_ciphers
# (категория soft). Корректируется по мере появления новых версий браузеров.
#
# Формат (секционный): секция [<browser>] + expected_cipher_cnt/status.
# При сдвиге cipher_cnt у новой версии — продакт сначала добавляет новое
# значение со status=staging (рядом со старым), потом промоутит после калибровки.

[chrome]
expected_cipher_cnt = 15
status = active

[firefox]
expected_cipher_cnt = 16
status = active

[safari]
expected_cipher_cnt = 20
status = active

[edge]
# обычно совпадает с Chrome
expected_cipher_cnt = 15
status = active
