# blocklist_ip.conf — the curated IP blocklist.
# See docs/product/config-templates.md §3.
#
# Empty at the start. Filled through PRs based on log analysis
# (scripts/analyze.py) or complaints. Used by the ip_blocklist rule
# (blocking category).
#
# Format: <ip-or-cidr>  status=staging|active  added=<date>  reason=<short>  pr=<link>
#
# Staged rollout: new IPs are first added with status=staging — they match and
# are written to staging_match in the log, but do not block. After 24–48 h of FP-rate
# analysis, a separate PR moves them to status=active.
#
# Examples (after the first PRs):
# 203.0.113.42     status=active   added=2026-06-01  reason=brute-force-login   pr=#42
# 198.51.100.0/24  status=staging  added=2026-06-15  reason=scanner-pattern     pr=#71
