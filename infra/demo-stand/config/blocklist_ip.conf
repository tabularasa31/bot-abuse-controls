# blocklist_ip.conf — кураторский IP-blocklist (Phase 1+).
# См. docs/product/config-templates.md §3.
#
# Пуст на старте. Наполняется через PR по результатам анализа логов
# (scripts/analyze.py) или жалоб. Используется правилом ip_blocklist
# (категория blocking).
#
# Формат: <ip-or-cidr>  status=staging|active  added=<date>  reason=<short>  pr=<link>
#
# Staged rollout: новые IP сначала добавляются с status=staging — матчатся,
# пишутся в staging_match лога, но не блокируют. После 24-48ч анализа FP-rate —
# отдельный PR с переводом в status=active.
#
# Примеры (после первых PR):
# 203.0.113.42     status=active   added=2026-06-01  reason=brute-force-login   pr=#42
# 198.51.100.0/24  status=staging  added=2026-06-15  reason=scanner-pattern     pr=#71
