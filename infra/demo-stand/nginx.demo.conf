# The demo edge: the cascade in access_by_lua, then a proxy to the tenant's
# origin. A host with a non-empty origin_ip in its policy is a tenant;
# everything else is dropped with 444.
#
# The public surface is deliberately tiny — everything operational lives on the
# private :9090 plane or in the pushed log streams.

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log notice;
# nginx clears the environment for workers, so anything Lua reads through
# os.getenv has to be declared here.
env REVISION;
env EDGE_ID;
# BAC_DEMO_GEO_HEADER lets a request header override the client IP for the geo
# lookup, for testing only; it is off by default.
env BAC_DEMO_GEO_HEADER;
env BAC_GEOIP_DIR;
# The catalog server. Unreachable just means transport errors each tick, with
# the edge staying on its last good state.
env ANTIBOT_BACKEND_URL;
env ANTIBOT_BACKEND_HOST;
# Both required for mTLS to engage; without them the pull runs over plain
# HTTPS, which suits an IP-allowlisted backend.
env ANTIBOT_BACKEND_CLIENT_CERT;
env ANTIBOT_BACKEND_CLIENT_KEY;
# Without this declaration nginx clears the variable before init_by_lua and the
# override is silently ignored.
env CHALLENGE_HMAC_SECRET_FILE;
# Set false when the backend uses a certificate the container's CA bundle
# cannot validate. Defaults to verifying.
env ANTIBOT_BACKEND_SSL_VERIFY;
# Override the Channel C pull interval (default 30s). Production stays at
# the default; the integration harness (infra/test-harness) sets a short
# value so CI doesn't pay the 30s tick on every assertion.
env ANTIBOT_BACKEND_PULL_INTERVAL;
# On-demand TLS: names under the stand's own apex use the static certificate,
# never ACME. Storage should be a mounted volume so certificates survive a
# restart.
env STAND_BASE_DOMAIN;
env AUTO_SSL_DIR;
env AUTO_SSL_STAGING;
env ACME_ACCOUNT_EMAIL;
events { worker_connections 4096; }

http {
    log_format demo '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /usr/local/openresty/nginx/logs/access.log demo;

    # /etc/nginx/lua — cascade modules (verdict, hygiene, reputation,
    # rate_limit, tls_fp, …) + fp compute (ja4_compute, ja4_helpers).
    lua_package_path "/etc/nginx/lua/?.lua;;";
    # Add Alpine's C-module dir so require("lfs") resolves — lua-resty-acme's
    # `file` storage adapter needs luafilesystem (apk lua5.1-filesystem →
    # /usr/lib/lua/5.1/lfs.so). `;;` appends OpenResty's default cpath.
    lua_package_cpath "/usr/lib/lua/5.1/?.so;;";

    # Required for outbound TLS from Lua: without a trusted bundle the ACME
    # directory request fails and issuance never starts.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Depth 5 (not 3): Let's Encrypt can serve cross-signed chains, and a future
    # custom ACME directory may use deeper paths — 5 is headroom without cost
    # (gemini review on PR #96).
    lua_ssl_verify_depth 5;

    # Verdict pipeline shared dicts.
    lua_shared_dict verdict_cache 10m;
    # Every catalog dict holds two generations at once during a swap, so each is
    # sized for roughly twice its catalog. Keys are `<entry>:<gen>`.
    lua_shared_dict tls_fp_blocklist 10m;
    # Verified bot IPs from the rDNS worker; tens of thousands of entries.
    lua_shared_dict verified_bots 5m;
    # Automation signatures behind tls_fp_impersonator; tens of entries.
    lua_shared_dict tls_fp_catalog 1m;
    # Expected cipher counts per browser family; a handful of entries.
    lua_shared_dict tls_fp_browser_profiles 1m;
    # Per-host policy, one encoded table per host; hundreds of customers.
    lua_shared_dict antibot_policy 1m;
    # UA patterns: two keys per generation, the combined active regex and the
    # staged list.
    lua_shared_dict antibot_ua_blacklist 1m;
    # Blocked CIDRs with their status; tens of thousands of entries.
    lua_shared_dict antibot_ip_blocklist 10m;
    # Allowed CIDRs, a flat list with no status. Small, but sized to match the
    # blocklist.
    lua_shared_dict antibot_ip_whitelist 10m;
    # Datacenter ASNs behind the asn_dc tag; hundreds of entries.
    lua_shared_dict antibot_asn_datacenters 1m;
    # Per-catalog generation, etag and version. Readers take the generation from
    # here to build their lookup key.
    lua_shared_dict meta 1m;
    # Demo-stand observability — counters dumped as EDGE_STATS to stdout→Loki
    # (edge_stats.lua) and served on the private :9090 /__stats plane.
    lua_shared_dict metrics 1m;
    # Last-N request records (ring buffer). Written by log_event; its /__admin
    # reader was removed — retained for a future private mgmt view.
    lua_shared_dict recent 1m;
    # Per-fp counts → fp cardinality gauge (first-seen via dict:add).
    lua_shared_dict fp_seen 5m;
    # L4 rate_limits: per-key GCRA TAT cells + scan-urls unique counters.
    lua_shared_dict rate_limit 10m;
    # The clearance cookie's HMAC secret and its fingerprint.
    lua_shared_dict challenge_secret 1m;
    # Solved nonces, expiring with the nonce itself. 5m covers roughly 3K
    # challenges a minute at the 60-second TTL, with headroom.
    lua_shared_dict used_nonces 5m;

    # On-demand TLS needs no shared dict here: it stores certificates and the
    # issuance lock on disk.

    # A timer callback does not inherit the server-scope resolver, so the
    # catalog pull needs its own. Included from a file, so the test harness can
    # swap in a docker-aware list without forking this config.
    include /etc/nginx/resolver.conf;

    init_by_lua_file /etc/nginx/lua/init.lua;

    # One timer per catalog, on worker 0 only, so the pull rate does not scale
    # with the worker count.
    init_worker_by_lua_block {
        -- The BAC_LOG shipper (edge → /v1/logs) is ALWAYS loaded — even without
        -- ANTIBOT_BACKEND_URL. start() itself decides: with a URL it wires up
        -- timer.every; without one, backend_url stays nil and enqueue
        -- increments bac_log_dropped_total. That lets the dashboard tell
        -- "no traffic" (enqueued=dropped=0) from "shipper disabled"
        -- (dropped grows in proportion to RPS). Leaving the require
        -- below the early return would keep the module out of package.loaded
        -- and bac_log.emit's lookup would return nil → dead metrics.
        require("log_shipper").start({})

        -- on-demand TLS worker init (lua-resty-auto-ssl). MUST run before the
        -- no-backend early-return below — cert issuance is independent of
        -- Channel C. No-op if setup() failed in init (auto_ssl nil) → static
        -- fallback cert.
        require("tls_autossl").init_worker()

        -- EDGE_STATS aggregate dump (edge_stats.lua). Replaces the removed
        -- /metrics endpoint: a worker-0 timer writes one `EDGE_STATS {json}`
        -- line every interval to stdout → promtail → Loki. MUST run before the
        -- no-backend early-return below — stats ship via stdout, not the
        -- backend, so they work even when Channel C is unconfigured. start()
        -- self-guards to worker 0 (single emitter across the pool).
        require("edge_stats").start({})

        -- catalog_pull (Channel C): skip the timer entirely if no backend
        -- is configured (URL unset OR set to empty string by `${VAR:-}` in
        -- compose). The stand runs out-of-box on its static seed; no need
        -- for spammy "bad uri" / ECONNREFUSED in error.log every 30s.
        -- The shipper above is a separate module that behaves correctly
        -- on its own without a URL (see the comment before its start()).
        local url = os.getenv("ANTIBOT_BACKEND_URL")
        if url == nil or url == "" then
            return
        end
        -- All env passthrough — catalog_pull itself normalises empty strings
        -- as nil for cert/host/ssl_verify, so plain os.getenv is fine.
        --
        -- ANTIBOT_BACKEND_PULL_INTERVAL — override the 30s pull cadence
        -- (config-distribution §Channel C). Production stays at the 30s
        -- default; the integration harness () sets a short value (3-5s)
        -- to fit CI budget without paying for the 30s tick on every assert.
        -- catalog_pull.start treats nil as 30s, so an unset env is the
        -- same as no override.
        local pull_interval = tonumber(os.getenv("ANTIBOT_BACKEND_PULL_INTERVAL"))
        require("catalog_pull").start({
            catalogs = { "tls_fp_blocklist", "verified_bot_ips",
                         "tls_fp_catalog", "tls_fp_browser_profiles",
                         "ua_blacklist", "ip_blocklist",
                         "ip_whitelist", "asn_datacenters",
                         "policy" },
            interval = pull_interval,
        })
    }

    # The private management plane: read-only, no cascade.
    #
    # Its boundary is the compose publish bind, hardcoded to loopback. A
    # client-IP ACL would not help: a published port is NAT'd, so nginx sees the
    # docker gateway for every client.
    server {
        listen 9090;
        server_name _;

        location = /__health { return 200 "ok\n"; }

        # Read-only view of the effective per-host policy (was on public :443
        # previously). Logic lives in policy_view.lua (testable; keeps the
        # empty-list→[] wire contract in one named place). ?host= overrides Host.
        location = /__policy {
            default_type application/json;
            content_by_lua_block { require("policy_view").handle() }
        }

        # The same snapshot the stdout stream pushes, encoded the same way, so
        # the two are byte-identical — including empty buckets, which must stay
        # objects rather than arrays.
        location = /__stats {
            default_type application/json;
            content_by_lua_block {
                ngx.say(require("cjson.safe").encode(require("edge_stats").collect() or {}))
            }
        }

        # Nothing else on the mgmt plane.
        location / { return 404; }
    }

    # Plain HTTP, only for the ACME challenge and a redirect, so it has to be
    # publicly reachable. The cascade does not run here: the challenge must not
    # be filtered.
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            content_by_lua_block { require("tls_autossl").serve_http_challenge() }
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # On-demand cert selection per SNI (tenant custom domains). No-op when
        # auto-ssl is inactive → the static fallback below is served, i.e.
        # current behaviour for the stand's own base-domain names and the IP.
        ssl_certificate_by_lua_block { require("tls_autossl").ssl_certificate() }

        # Static fallback cert. Required even with ssl_certificate_by_lua, and
        # serves every name auto-ssl declines (allow_domain=false): the stand
        # base domain (bac/dashboard under *.example.com) and the edge IP.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Required for $ssl_ciphers to be populated meaningfully across
        # session reuse — without this nginx caches only the negotiated
        # cipher rather than the offered list.
        ssl_session_cache   shared:SSL:10m;

        # A variable proxy_pass (origin chosen per-request from Policy)
        # resolves the upstream host at request time, so it needs a resolver.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        # A tenant is a host with a non-empty origin_ip in its policy;
        # everything else resolves to "" and is dropped below.
        set_by_lua_block $origin {
            return require("proxy_target").origin(ngx.var.host)
        }
        # $origin never carries a port, path or other scheme, so the upstream
        # Host and SNI are just the tenant hostname with no parsing.
        set_by_lua_block $origin_host { local o = ngx.var.origin; return (o and o ~= "") and ngx.var.host or "" }
        set_by_lua_block $origin_sni  { local o = ngx.var.origin; return (o and o ~= "") and ngx.var.host or "" }

        # The origin URL with its hostname replaced by the tenant's IP: the
        # hostname resolves to this edge, so resolving it here would loop back
        # into the cascade. Host and SNI upstream stay the hostname.
        set_by_lua_block $origin_resolve {
            local origin_resolve = require "origin_resolve"
            local ip, loop_host = require("proxy_target").backend(ngx.var.host)
            return origin_resolve.resolve(ngx.var.origin, ip, loop_host)
        }

        # The only operational endpoint left public: it leaks nothing and
        # mutates nothing, so an external uptime check can reach it.
        location = /__health {
            return 200 "ok\n";
        }

        # A named location, so it is not routable from outside. The client's URL
        # is preserved, and the reload after solving returns to it with the
        # cookie.
        location @challenge_page {
            content_by_lua_block {
                local html, err = require("challenge").render(ngx.var.host or "")
                if not html then
                    -- Fail-open: a render bug must not fail grey cases
                    -- with a 500. Cache-Control: no-store on the fail-open path
                    -- as well — otherwise a CDN in front of the stand could cache
                    -- 'ok' under the original URL and bypass the cascade until the TTL expires
                    -- (code-review on PR #87).
                    ngx.log(ngx.ERR, "challenge_page: render failed: ", err)
                    ngx.status = 200
                    ngx.header.content_type = "text/plain; charset=utf-8"
                    ngx.header.cache_control = "no-store"
                    ngx.print("ok")
                    return
                end
                ngx.shared.metrics:incr("challenge_issued_total", 1, 0)
                ngx.status = 200
                ngx.header.content_type = "text/html; charset=utf-8"
                ngx.header.cache_control = "no-store"
                ngx.print(html)
            }
            # The exec moves the log phase to this location, so without an
            # explicit handler a served challenge would emit no record at all and
            # the shadow-to-active comparison would have a hole in it.
            log_by_lua_file /etc/nginx/lua/log_event.lua;
        }

        # The solver's POST endpoint. It sits outside the cascade: the answer
        # arrives at a new URL, and running the cascade here would bounce it back
        # to a challenge before the cookie could be issued.
        location = /__challenge/verify {
            # The JS solver sends under 2KB of JSON; client_body_buffer_size>=4k means
            # the body is always in memory and ngx.req.get_body_data() will not return nil
            # because of a disk buffer.
            client_body_buffer_size 8k;
            client_max_body_size    8k;
            content_by_lua_block {
                require("challenge_verify").handle()
            }
        }


        # Everything else is a protected tenant site: cascade, then proxy.
        #
        # A non-tenant Host is dropped with 444 before the cascade, bumping a
        # counter so the volume stays visible even though these never reach the
        # log. The deny_nontenant lever rejects the same traffic at the
        # handshake instead.
        location / {
            set_by_lua_block $edge_action {
                if (ngx.var.origin or "") ~= "" then return "tenant" end
                local m = ngx.shared.metrics
                if m then m:incr("edge_nontenant_dropped_total", 1, 0) end
                return "deny"
            }
            if ($edge_action = "deny") { return 444; }
            access_by_lua_file    /etc/nginx/lua/verdict.lua;
            proxy_http_version    1.1;
            proxy_set_header      Host              $origin_host;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name        $origin_sni;
            proxy_ssl_verify      off;
            # $origin_resolve is the loop-safe upstream URL (see its
            # set_by_lua_block above); $request_uri is the original path
            # + query, preserved when proxying.
            proxy_pass            $origin_resolve$request_uri;
            log_by_lua_file       /etc/nginx/lua/log_event.lua;
        }
    }
}
