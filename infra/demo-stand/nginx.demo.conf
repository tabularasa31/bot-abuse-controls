# Demo-stand nginx config — same verdict pipeline as production, but
# fronted by multi-scenario endpoints so a reviewer can probe each
# behaviour from a single URL.
#
# Request handling per location:
#   /              → access_by_lua verdict.lua → proxy_pass to ORIGIN_URL (allow)
#                                              → ngx.exit(403) (block)
#                    (no ORIGIN_URL → bundled landing page, cascade still runs)
#   /__fp          → probe (bypasses verdict, always 200)
#   /__health      → static "ok" (bypasses verdict)
#   /__version     → static version + uptime (bypasses verdict)
#   /__admin       → admin status HTML (bypasses verdict)
#   /metrics       → Prometheus text format (bypasses verdict)
#   /baseline/     → proxy to the same origin but bypasses the verdict
#                    pipeline — for direct wrk perf comparison
#
# The stand is a real reverse proxy: the cascade runs, then (on allow) the
# request is proxied to the origin (vision Step 6 — antibot in front of
# origin). Origin is ORIGIN_URL from infra/demo-stand/.env (not committed).

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log notice;
# Whitelist env vars that worker processes can see via os.getenv (nginx
# clears the env by default for security). REVISION is read by the
# /__version handler; EDGE_ID is the edge_id stamped into every BAC log
# record (bac_log.lua, defaults to "stand-bac"). docker-compose.demo.yml
# sets both from the host env.
env REVISION;
env EDGE_ID;
# ORIGIN_URL — upstream the cascade fronts (scheme+host, no trailing slash,
# e.g. https://example.com). Set in infra/demo-stand/.env on the VM; not
# committed. When unset, the proxied locations return 503.
env ORIGIN_URL;
# BAC_DEMO_GEO_HEADER — when "on", reputation.lua honours an X-Demo-IP request
# header to override the client IP for GeoIP lookups (stand testing only;
# default off → real remote_addr). BAC_GEOIP_DIR — where the GeoLite2 .mmdb
# files live inside the container (default /etc/nginx/geoip).
env BAC_DEMO_GEO_HEADER;
env BAC_GEOIP_DIR;
# ANTIBOT_BACKEND_URL — base URL of antibot-backend Channel C catalog server
# (scheme+host[:port], no trailing slash). When unset, catalog_pull.start
# falls back to "http://antibot-backend:8080" (docker-compose service name).
# An unresolvable host just produces transport errors on each tick; the edge
# stays on the static seed (fail-stale).
env ANTIBOT_BACKEND_URL;
env ANTIBOT_BACKEND_HOST;
# [B6] mTLS client material for Channel C — paths inside the container,
# typically /etc/nginx/certs/edge-client.{crt,key}. Both required for mTLS
# to engage; missing/empty means HTTPS without a client cert (used when the
# backend's AUTH_MODE is ip-allowlist or off).
env ANTIBOT_BACKEND_CLIENT_CERT;
env ANTIBOT_BACKEND_CLIENT_KEY;
# Override the default ssl_verify=true for Channel C handshake. Set to
# `false` (or 0/no/off) when the backend uses a self-signed / not-trusted
# cert that an edge container's CA bundle wouldn't validate (typical for
# our demo-backend on a side VM). Default true → production-path requires
# a properly-rooted server cert. config-distribution §Auth/transport.
env ANTIBOT_BACKEND_SSL_VERIFY;
events { worker_connections 4096; }

http {
    log_format demo '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /usr/local/openresty/nginx/logs/access.log demo;

    # /etc/nginx/lua — cascade modules (verdict, hygiene, reputation,
    # rate_limit, tls_fp, …) + fp compute (ja4_compute, ja4_helpers).
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Verdict pipeline shared dicts.
    lua_shared_dict verdict_cache 10m;
    # fp_blocklist holds two generations side-by-side during the §В1
    # atomic-swap window (new written → gen flipped → old swept), so size it
    # for ~2× the largest catalog. 10m is comfortable for tens of thousands
    # of fps with the `fp:gen` key shape.
    lua_shared_dict fp_blocklist 10m;
    # Catalog generation counters + ETags (§В1). Holds fp_blocklist_gen,
    # fp_blocklist_etag, fp_blocklist_version (and the equivalent triplet for
    # any other catalog Channel C pulls). Blocklist readers always look up
    # `fp:gen` where gen is read from this dict per request.
    lua_shared_dict meta 1m;
    # Demo-stand observability — counters served by /metrics + /__admin.
    lua_shared_dict metrics 1m;
    # Last-N request records (ring buffer) for the /__admin live view.
    lua_shared_dict recent 1m;
    # Per-fp counts → fp cardinality gauge (first-seen via dict:add).
    lua_shared_dict fp_seen 5m;
    # L4 rate_limits: per-key GCRA TAT cells + scan-urls unique counters.
    lua_shared_dict rate_limit 10m;

    init_by_lua_file /etc/nginx/lua/init.lua;

    # Channel C catalog pull (B5, RFC §В1). One ngx.timer.every per catalog,
    # guarded to worker 0 inside catalog_pull.start so an N-worker pool issues
    # one pull per machine per 30s, not N×. Fail-stale: a backend outage just
    # leaves the previous generation in the shared_dict; verdict.lua keeps
    # reading the static seed (gen=0) populated by init.lua until a pull lands.
    init_worker_by_lua_block {
        -- BAC_LOG shipper (edge → /v1/logs) ГРУЗИМ ВСЕГДА — даже без
        -- ANTIBOT_BACKEND_URL. Внутри start() сам решает: с URL — wire
        -- timer.every; без URL — backend_url остаётся nil, enqueue
        -- инкрементит bac_log_dropped_total. Так дашборд отличает
        -- «трафика нет» (enqueued=dropped=0) от «shipper выключен»
        -- (dropped растёт пропорционально RPS). Если оставить require
        -- под early-return ниже — модуль не попадёт в package.loaded
        -- и bac_log.emit'овский lookup вернёт nil → метрики мёртвые.
        require("log_shipper").start({})

        -- catalog_pull (Channel C): skip the timer entirely if no backend
        -- is configured (URL unset OR set to empty string by `${VAR:-}` in
        -- compose). The stand runs out-of-box on its static seed; no need
        -- for spammy "bad uri" / ECONNREFUSED in error.log every 30s.
        -- Шиппер выше — отдельный модуль, который сам корректно ведёт
        -- себя без URL (см. комментарий перед его start()).
        local url = os.getenv("ANTIBOT_BACKEND_URL")
        if url == nil or url == "" then
            return
        end
        -- All env passthrough — catalog_pull itself normalises empty strings
        -- as nil for cert/host/ssl_verify, so plain os.getenv is fine.
        require("catalog_pull").start({
            catalogs = { "fp_blocklist" },
        })
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Required for $ssl_ciphers to be populated meaningfully across
        # session reuse — without this nginx caches only the negotiated
        # cipher rather than the offered list.
        ssl_session_cache   shared:SSL:10m;

        # A variable proxy_pass (origin comes from env at request time)
        # resolves the upstream host at request time, so it needs a resolver.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        # Origin the cascade fronts, read from ORIGIN_URL once per request.
        # $origin_host = host[:port] for the upstream Host header; $origin_sni
        # strips the port (TLS SNI must be a hostname, RFC 6066).
        set_by_lua_block $origin      { return os.getenv("ORIGIN_URL") or "" }
        set_by_lua_block $origin_host { local u = os.getenv("ORIGIN_URL") or ""; return (u:gsub("^https?://", ""):gsub("/.*$", "")) }
        set_by_lua_block $origin_sni  { local u = os.getenv("ORIGIN_URL") or ""; return (u:gsub("^https?://", ""):gsub("[:/].*$", "")) }

        # Educational fp dump. NOT protected — we want sceptical
        # reviewers to be able to inspect their own fingerprint even
        # if their default client is in the blocklist.
        location = /__fp {
            content_by_lua_file /etc/nginx/lua/probe.lua;
        }

        # Liveness probe + version. Bypass verdict so external probers
        # (uptime monitoring, etc.) don't pollute the counters.
        location = /__health {
            return 200 "ok\n";
        }
        location = /__version {
            content_by_lua_block {
                local t  = ngx.shared.metrics:get("start_time") or ngx.time()
                local up = ngx.time() - t
                ngx.header.content_type = "text/plain"
                -- Prefer the live sha that scripts/update.sh writes after a
                -- hot reload (env REVISION is frozen at container start, so it
                -- goes stale across reloads). Fall back to the env var, then
                -- "unknown".
                local rev
                local f = io.open("/etc/nginx/lua/.revision", "r")
                if f then rev = f:read("*l"); f:close() end
                if not rev or rev == "" then rev = os.getenv("REVISION") end
                ngx.say("commit: ", rev or "unknown")
                ngx.say("uptime_seconds: ", up)
                ngx.say("openresty: ", ngx.config.nginx_version, " / ", ngx.config.ngx_lua_version)
            }
        }

        # Admin status HTML and Prometheus metrics.
        location = /__admin {
            content_by_lua_file /etc/nginx/lua/admin.lua;
        }
        location = /metrics {
            content_by_lua_file /etc/nginx/lua/metrics.lua;
        }

        # /baseline/ — proxies to the SAME origin but BYPASSES the verdict
        # pipeline, so the only difference vs / is the cascade overhead:
        #   wrk -c100 -d10s https://<host>/          # with antibot
        #   wrk -c100 -d10s https://<host>/baseline/ # without
        location = /baseline/ {
            if ($origin = "") { return 503 "ORIGIN_URL not set\n"; }
            proxy_http_version    1.1;
            proxy_set_header      Host              $origin_host;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name        $origin_sni;
            proxy_ssl_verify      off;
            proxy_pass            $origin/;
        }

        # Everything not carved out above is the protected site: run the
        # cascade, then proxy to the origin (vision Step 6 — antibot sits
        # in front of origin). Block verdicts ngx.exit(403) inside
        # verdict.lua; allow falls through to proxy_pass. When ORIGIN_URL
        # is not configured, fall back to the bundled landing page so the
        # stand still works out-of-box (the cascade still runs there).
        location / {
            if ($origin = "") { rewrite ^ /__landing last; }
            access_by_lua_file    /etc/nginx/lua/verdict.lua;
            proxy_http_version    1.1;
            proxy_set_header      Host              $origin_host;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name        $origin_sni;
            proxy_ssl_verify      off;
            proxy_pass            $origin$request_uri;
            log_by_lua_file       /etc/nginx/lua/log_event.lua;
        }

        # Bundled landing page — served when no ORIGIN_URL is set (internal
        # redirect target, not directly reachable). Runs the cascade + logs
        # so the demo exercises the full pipeline even without an upstream.
        location = /__landing {
            internal;
            access_by_lua_file /etc/nginx/lua/verdict.lua;
            alias              /etc/nginx/sites/default-site/index.html;
            log_by_lua_file    /etc/nginx/lua/log_event.lua;
        }
    }
}
