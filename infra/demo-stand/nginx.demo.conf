# Demo-stand nginx config — same verdict pipeline as production, but
# fronted by multi-scenario endpoints so a reviewer can probe each
# behaviour from a single URL.
#
# Request handling per location:
#   /              → access_by_lua verdict.lua → proxy_pass to ORIGIN_URL (allow)
#                                              → ngx.exit(403) (block)
#                    (no ORIGIN_URL → bundled landing page, cascade still runs)
#   /__fp          → probe (bypasses verdict, always 200)
#   /__health      → static "ok" (bypasses verdict)
#   /__version     → static version + uptime (bypasses verdict)
#   /__challenge_preview → [C2] rendered challenge page w/ fresh nonce
#                          (TEMPORARY — remove with C5 landing)
#   /__admin       → admin status HTML (bypasses verdict)
#   /metrics       → Prometheus text format (bypasses verdict)
#   /baseline/     → proxy to the same origin but bypasses the verdict
#                    pipeline — for direct wrk perf comparison
#
# The stand is a real reverse proxy: the cascade runs, then (on allow) the
# request is proxied to the origin (vision Step 6 — antibot in front of
# origin). Origin is ORIGIN_URL from infra/demo-stand/.env (not committed).

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log notice;
# Whitelist env vars that worker processes can see via os.getenv (nginx
# clears the env by default for security). REVISION is read by the
# /__version handler; EDGE_ID is the edge_id stamped into every BAC log
# record (bac_log.lua, defaults to "stand-bac"). docker-compose.demo.yml
# sets both from the host env.
env REVISION;
env EDGE_ID;
# ORIGIN_URL — upstream the cascade fronts (scheme+host, no trailing slash,
# e.g. https://example.com). Set in infra/demo-stand/.env on the VM; not
# committed. When unset, the proxied locations return 503.
env ORIGIN_URL;
# DASHBOARD_BACKEND_IP — private IP of the dashboard backend, read by
# nginx-demo's $origin_resolve set_by_lua_block to short-circuit the
# resolver-driven DNS lookup that would otherwise loop the cascade into
# itself (public DNS for dashboard.example.com points at THIS edge).
env DASHBOARD_BACKEND_IP;
# BAC_DEMO_GEO_HEADER — when "on", reputation.lua honours an X-Demo-IP request
# header to override the client IP for GeoIP lookups (stand testing only;
# default off → real remote_addr). BAC_GEOIP_DIR — where the GeoLite2 .mmdb
# files live inside the container (default /etc/nginx/geoip).
env BAC_DEMO_GEO_HEADER;
env BAC_GEOIP_DIR;
# ANTIBOT_BACKEND_URL — base URL of antibot-backend Channel C catalog server
# (scheme+host[:port], no trailing slash). When unset, catalog_pull.start
# falls back to "http://antibot-backend:8080" (docker-compose service name).
# An unresolvable host just produces transport errors on each tick; the edge
# stays on the static seed (fail-stale).
env ANTIBOT_BACKEND_URL;
env ANTIBOT_BACKEND_HOST;
# [B6] mTLS client material for Channel C — paths inside the container,
# typically /etc/nginx/certs/edge-client.{crt,key}. Both required for mTLS
# to engage; missing/empty means HTTPS without a client cert (used when the
# backend's AUTH_MODE is ip-allowlist or off).
env ANTIBOT_BACKEND_CLIENT_CERT;
env ANTIBOT_BACKEND_CLIENT_KEY;
# [C1] Override the default Phase 4 HMAC secret path (default
# /etc/nginx/certs/challenge_secret.key). Used by the integration harness
# and local runs that mount the secret somewhere else. Without this
# directive nginx clears the var before init_by_lua and the override is
# silently ignored.
env CHALLENGE_HMAC_SECRET_FILE;
# Override the default ssl_verify=true for Channel C handshake. Set to
# `false` (or 0/no/off) when the backend uses a self-signed / not-trusted
# cert that an edge container's CA bundle wouldn't validate (typical for
# our demo-backend on a side VM). Default true → production-path requires
# a properly-rooted server cert. config-distribution §Auth/transport.
env ANTIBOT_BACKEND_SSL_VERIFY;
# Override the Channel C pull interval (default 30s). Production stays at
# the default; the integration harness (infra/test-harness) sets a short
# value so CI doesn't pay the 30s tick on every assertion.
env ANTIBOT_BACKEND_PULL_INTERVAL;
events { worker_connections 4096; }

http {
    log_format demo '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /usr/local/openresty/nginx/logs/access.log demo;

    # /etc/nginx/lua — cascade modules (verdict, hygiene, reputation,
    # rate_limit, tls_fp, …) + fp compute (ja4_compute, ja4_helpers).
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Verdict pipeline shared dicts.
    lua_shared_dict verdict_cache 10m;
    # tls_fp_blocklist holds two generations side-by-side during the §В1
    # atomic-swap window (new written → gen flipped → old swept), so size it
    # for ~2× the largest catalog. 10m is comfortable for tens of thousands
    # of fps with the `fp:gen` key shape.
    lua_shared_dict tls_fp_blocklist 10m;
    # verified_bots (B8) — Channel C `verified_bot_ips` catalog, populated
    # by the rDNS worker (B7). Keys are `<ip>:<gen>` (mirrors tls_fp_blocklist's
    # §В1 atomic-swap shape: two generations coexist during the write→flip
    # →sweep window); values are `<status>:<family>`. Bot_verified read
    # path is verified_bots.classify(ip). 5m holds tens of thousands of IPs.
    lua_shared_dict verified_bots 5m;
    # tls_fp_catalog (PR2 ADR-006) — Channel C каталог сигнатур автоматизации
    # для tls_fp_impersonator. Keys: `<hash_b>:<gen>`; values:
    # `<status>:<family>` (status ∈ {active, staging}; staged матчи пишут в
    # bac_log без блокировки — A11). Десятки записей в пределе, 1m с запасом.
    lua_shared_dict tls_fp_catalog 1m;
    # tls_fp_browser_profiles (PR2 ADR-006) — Channel C каталог ожидаемых
    # cipher_cnt для семейств браузеров (tls_fp_suspicious_ciphers). Keys:
    # `<family>:<gen>`; values: `<status>:<expected_cipher_cnt>`. Единицы
    # записей; 1m избыточно.
    lua_shared_dict tls_fp_browser_profiles 1m;
    # antibot_policy (B11) — Channel C catalog `policy` keyed by Host. Keys
    # are `<host>:<gen>` (mirrors the §В1 atomic-swap shape); values are
    # the per-host Policy table cjson-encoded as one JSON string. Read path
    # is policy.get(host) → fall back to POOL_DEFAULT on miss. 1m fits
    # hundreds of clients with average policy size; bump if needed.
    lua_shared_dict antibot_policy 1m;
    # Catalog generation counters + ETags (§В1). Holds tls_fp_blocklist_gen,
    # tls_fp_blocklist_etag, tls_fp_blocklist_version (and the equivalent triplet for
    # any other catalog Channel C pulls). Blocklist readers always look up
    # `fp:gen` where gen is read from this dict per request.
    lua_shared_dict meta 1m;
    # Demo-stand observability — counters served by /metrics + /__admin.
    lua_shared_dict metrics 1m;
    # Last-N request records (ring buffer) for the /__admin live view.
    lua_shared_dict recent 1m;
    # Per-fp counts → fp cardinality gauge (first-seen via dict:add).
    lua_shared_dict fp_seen 5m;
    # L4 rate_limits: per-key GCRA TAT cells + scan-urls unique counters.
    lua_shared_dict rate_limit 10m;
    # [C1] Phase 4 HMAC secret для clearance cookie. Хранит одну строку
    # secret + 8-hex fingerprint, загружается init_by_lua из ./certs/
    # challenge_secret.key (file-mount, Channel A на демо). Ротация =
    # `openresty -s reload`; см. challenge_secret.lua.
    lua_shared_dict challenge_secret 1m;
    # [C5] Single-use nonce store for /__challenge/verify. Key = b64url
    # HMAC-сегмент решённого nonce'a, value = 1, TTL = (exp - now) + 5s
    # slack — записи сметаются автоматически после истечения nonce'a.
    # 5m достаточно при rate < ~3K challenge/min с 60-секундным TTL'ом
    # (~180K записей × ~60 байт = ~11M; запас 50% от 5m → 100% headroom).
    lua_shared_dict used_nonces 5m;

    # DNS for cosockets created in ngx.timer / init_worker context —
    # catalog_pull.lua calls resty.http into ANTIBOT_BACKEND_URL from a
    # timer callback, which doesn't inherit the server-scope resolver
    # (server-scope resolver applies only to handler-phase cosockets).
    # Loaded via include so the integration harness can swap to a
    # docker-DNS-aware list (see infra/test-harness/resolver.conf
    # mount) without forking the whole nginx config. Server-scope
    # `resolver` below stays in place — covers the existing
    # proxy_pass codepath.
    include /etc/nginx/resolver.conf;

    init_by_lua_file /etc/nginx/lua/init.lua;

    # Channel C catalog pull (B5, RFC §В1). One ngx.timer.every per catalog,
    # guarded to worker 0 inside catalog_pull.start so an N-worker pool issues
    # one pull per machine per 30s, not N×. Fail-stale: a backend outage just
    # leaves the previous generation in the shared_dict; verdict.lua keeps
    # reading the static seed (gen=0) populated by init.lua until a pull lands.
    init_worker_by_lua_block {
        -- BAC_LOG shipper (edge → /v1/logs) ГРУЗИМ ВСЕГДА — даже без
        -- ANTIBOT_BACKEND_URL. Внутри start() сам решает: с URL — wire
        -- timer.every; без URL — backend_url остаётся nil, enqueue
        -- инкрементит bac_log_dropped_total. Так дашборд отличает
        -- «трафика нет» (enqueued=dropped=0) от «shipper выключен»
        -- (dropped растёт пропорционально RPS). Если оставить require
        -- под early-return ниже — модуль не попадёт в package.loaded
        -- и bac_log.emit'овский lookup вернёт nil → метрики мёртвые.
        require("log_shipper").start({})

        -- catalog_pull (Channel C): skip the timer entirely if no backend
        -- is configured (URL unset OR set to empty string by `${VAR:-}` in
        -- compose). The stand runs out-of-box on its static seed; no need
        -- for spammy "bad uri" / ECONNREFUSED in error.log every 30s.
        -- Шиппер выше — отдельный модуль, который сам корректно ведёт
        -- себя без URL (см. комментарий перед его start()).
        local url = os.getenv("ANTIBOT_BACKEND_URL")
        if url == nil or url == "" then
            return
        end
        -- All env passthrough — catalog_pull itself normalises empty strings
        -- as nil for cert/host/ssl_verify, so plain os.getenv is fine.
        --
        -- ANTIBOT_BACKEND_PULL_INTERVAL — override the 30s pull cadence
        -- (config-distribution §Channel C). Production stays at the 30s
        -- default; the integration harness (D8) sets a short value (3-5s)
        -- to fit CI budget without paying for the 30s tick on every assert.
        -- catalog_pull.start treats nil as 30s, so an unset env is the
        -- same as no override.
        local pull_interval = tonumber(os.getenv("ANTIBOT_BACKEND_PULL_INTERVAL"))
        require("catalog_pull").start({
            catalogs = { "tls_fp_blocklist", "verified_bot_ips",
                         "tls_fp_catalog", "tls_fp_browser_profiles",
                         "policy" },
            interval = pull_interval,
        })
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Required for $ssl_ciphers to be populated meaningfully across
        # session reuse — without this nginx caches only the negotiated
        # cipher rather than the offered list.
        ssl_session_cache   shared:SSL:10m;

        # A variable proxy_pass (origin comes from env at request time)
        # resolves the upstream host at request time, so it needs a resolver.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        # Per-host upstream selection. `bac.example.com` is now the
        # synthetic test entry-point: the cascade still runs for it (so
        # reviewers can curl with various UAs/fingerprints and watch
        # verdicts in BAC_LOG / /__admin), but pass-verdicts do NOT proxy
        # anywhere — they fall through to the bundled /__landing page
        # (the existing `if ($origin = "") { rewrite ^ /__landing last; }`
        # in `location /` handles that). Other hosts (e.g.
        # dashboard.example.com) proxy through to ORIGIN_URL as before.
        # $origin_host / $origin_sni stay ORIGIN_URL-driven — they're
        # only consulted when $origin is non-empty (i.e. we're actually
        # proxying), so they don't need the bac-exception.
        set_by_lua_block $origin {
            if ngx.var.host == "bac.example.com" then return "" end
            return os.getenv("ORIGIN_URL") or ""
        }
        # $origin_host = host[:port] for the upstream Host header; $origin_sni
        # strips the port (TLS SNI must be a hostname, RFC 6066).
        set_by_lua_block $origin_host { local u = os.getenv("ORIGIN_URL") or ""; return (u:gsub("^https?://", ""):gsub("/.*$", "")) }
        set_by_lua_block $origin_sni  { local u = os.getenv("ORIGIN_URL") or ""; return (u:gsub("^https?://", ""):gsub("[:/].*$", "")) }

        # $origin_resolve is what actually goes into `proxy_pass` — same as
        # $origin in the steady state, EXCEPT when the cascade itself is the
        # public DNS entry-point for the host being proxied (e.g.
        # dashboard.example.com). In that case `proxy_pass $origin` with a
        # variable triggers a runtime DNS lookup via the http-level resolver
        # (resolver.conf — 1.1.1.1 / 8.8.8.8), which returns the edge's own
        # public IP (since that's where the hostname now points) — and the
        # cascade proxies into itself, looping until headers overflow and
        # nginx returns 400 "Request Header Or Cookie Too Large".
        # docker-compose's `extra_hosts:` writes to /etc/hosts inside the
        # container, but nginx's `resolver`-driven path BYPASSES /etc/hosts.
        # The fix is to short-circuit the lookup: substitute the public
        # hostname with the backend's IP directly in the upstream URL.
        # Host / SNI stay $origin_host / $origin_sni — Caddy on the backend
        # still receives the correct hostname for vhost selection and cert
        # serving. DASHBOARD_BACKEND_IP is the operator-owned env var
        # (docker-compose.demo.yml: ${DASHBOARD_BACKEND_IP:-…}).
        set_by_lua_block $origin_resolve {
            local host = ngx.var.host or ""
            if host == "dashboard.example.com" then
                local ip = os.getenv("DASHBOARD_BACKEND_IP") or ""
                if ip ~= "" then
                    -- Substitute only the hostname inside $origin so the
                    -- scheme and port (if any) survive. A hard-coded
                    -- "https://" .. ip would have lost those if ORIGIN_URL
                    -- ever shipped with an explicit port (e.g.
                    -- :8443) or an http:// scheme for local testing.
                    -- The %. escapes match a literal dot.
                    return (ngx.var.origin:gsub("dashboard%.example%.com", ip))
                end
            end
            -- Other hosts (or no DASHBOARD_BACKEND_IP configured): no
            -- short-circuit, behave exactly as before.
            return ngx.var.origin
        }

        # Educational fp dump. NOT protected — we want sceptical
        # reviewers to be able to inspect their own fingerprint even
        # if their default client is in the blocklist.
        location = /__fp {
            content_by_lua_file /etc/nginx/lua/probe.lua;
        }

        # Liveness probe + version. Bypass verdict so external probers
        # (uptime monitoring, etc.) don't pollute the counters.
        location = /__health {
            return 200 "ok\n";
        }
        location = /__version {
            content_by_lua_block {
                local t  = ngx.shared.metrics:get("start_time") or ngx.time()
                local up = ngx.time() - t
                ngx.header.content_type = "text/plain"
                -- Prefer the live sha that scripts/update.sh writes after a
                -- hot reload (env REVISION is frozen at container start, so it
                -- goes stale across reloads). Fall back to the env var, then
                -- "unknown".
                local rev
                local f = io.open("/etc/nginx/lua/.revision", "r")
                if f then rev = f:read("*l"); f:close() end
                if not rev or rev == "" then rev = os.getenv("REVISION") end
                ngx.say("commit: ", rev or "unknown")
                ngx.say("uptime_seconds: ", up)
                ngx.say("openresty: ", ngx.config.nginx_version, " / ", ngx.config.ngx_lua_version)
                -- [C1] 8-hex fingerprint of the HMAC secret loaded at init_by_lua
                -- (challenge_secret.lua). Lets a reviewer confirm that a rotation
                -- reload picked up the new key; "null" if the file isn't mounted.
                ngx.say("challenge_secret_fp: ",
                    require("challenge_secret").fingerprint() or "null")
                -- [C2] Pinned cascade version, read from CASCADE_VERSION at
                -- init and matched against the challenge page template's
                -- meta tag. Mismatch fails nginx start, so a non-"null"
                -- value here means template+cascade are in sync.
                ngx.say("cascade_version: ",
                    require("challenge").template_version() or "null")
            }
        }

        # [C5] @challenge_page — named internal location. verdict.lua
        # делает ngx.exec("@challenge_page") для Branch A под mode=active.
        # URL клиента сохраняется (window.location.reload() уйдёт на
        # исходный URL уже с tf_clearance cookie). Не доступно извне:
        # named locations (`@…`) не маршрутизируются по URI.
        location @challenge_page {
            content_by_lua_block {
                local html, err = require("challenge").render(ngx.var.host or "")
                if not html then
                    -- Fail-open: render-баг не должен фейлить grey-кейсы
                    -- 500-кой; лог уже содержит verdict=challenge, отдаём
                    -- пустой 200 — поломка шаблона ловится через
                    -- antibot_challenge_issued_total оставшийся в нуле +
                    -- ERR-лог.
                    ngx.log(ngx.ERR, "challenge_page: render failed: ", err)
                    ngx.status = 200
                    ngx.header.content_type = "text/plain; charset=utf-8"
                    ngx.print("ok")
                    return
                end
                ngx.shared.metrics:incr("challenge_issued_total", 1, 0)
                ngx.status = 200
                ngx.header.content_type = "text/html; charset=utf-8"
                ngx.header.cache_control = "no-store"
                ngx.print(html)
            }
        }

        # [C5] /__challenge/verify — JS-solver POST endpoint. JSON-payload:
        # {nonce, token, cascade_version, not_a_robot, fp}. На успех
        # — Set-Cookie tf_clearance (clearance.issue, HMAC через C1) и 200,
        # JS на странице делает window.location.reload(), браузер уходит на
        # исходный URL уже с прикреплённым cookie, каскад фастпасит на
        # L2.1 (clearance_valid). Endpoint живёт ВНЕ verdict.lua (без
        # access_by_lua): этот же запрос с свежим nonce приходит на новый
        # URL, иначе grey-verdict повторно бы выкинул на challenge до
        # того, как cookie выписался.
        location = /__challenge/verify {
            # JS-solver шлёт <2KB JSON; client_body_buffer_size>=4k значит
            # body всегда в памяти, ngx.req.get_body_data() не вернёт nil
            # из-за дискового буфера.
            client_body_buffer_size 8k;
            client_max_body_size    8k;
            content_by_lua_block {
                require("challenge_verify").handle()
            }
        }

        # Admin status HTML and Prometheus metrics.
        location = /__admin {
            content_by_lua_file /etc/nginx/lua/admin.lua;
        }
        # B11 — read-only view of the effective per-host policy. Uses
        # ?host=<name> override for inspecting a host different from the
        # request's $host (useful with curl from another box). Returns
        # POOL_DEFAULT (mode=shadow) for unregistered hosts, matching
        # the backend's PoolDefault contract.
        #
        # Private cjson instance with encode_empty_table_as_object(false):
        # backend Policy list fields (ua_blacklist / ip_* / asn_block /
        # geo_whitelist / rate_rules) are JSON arrays. cjson.decode of an
        # empty array drops the empty_array_mt metatable, so a re-encode
        # via the global cjson would emit "{}" — wire-incompatible with
        # the dashboard. The private cjson keeps the choice local to this
        # endpoint without affecting other Lua modules.
        location = /__policy {
            default_type application/json;
            content_by_lua_block {
                local cjson  = require("cjson").new()
                cjson.encode_empty_table_as_object(false)
                local policy = require "policy"
                local host   = ngx.var.arg_host
                if not host or host == "" then host = ngx.var.host end
                ngx.say(cjson.encode({ host = host, policy = policy.get(host) }))
            }
        }
        location = /metrics {
            content_by_lua_file /etc/nginx/lua/metrics.lua;
        }

        # /baseline/ — proxies to the SAME origin but BYPASSES the verdict
        # pipeline, so the only difference vs / is the cascade overhead:
        #   wrk -c100 -d10s https://<host>/          # with antibot
        #   wrk -c100 -d10s https://<host>/baseline/ # without
        location = /baseline/ {
            if ($origin = "") { return 503 "ORIGIN_URL not set\n"; }
            proxy_http_version    1.1;
            proxy_set_header      Host              $origin_host;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name        $origin_sni;
            proxy_ssl_verify      off;
            # See $origin_resolve set_by_lua_block — falls back to $origin
            # for everything except the loop-prone dashboard host.
            proxy_pass            $origin_resolve/;
        }

        # Everything not carved out above is the protected site: run the
        # cascade, then proxy to the origin (vision Step 6 — antibot sits
        # in front of origin). Block verdicts ngx.exit(403) inside
        # verdict.lua; allow falls through to proxy_pass. When ORIGIN_URL
        # is not configured, fall back to the bundled landing page so the
        # stand still works out-of-box (the cascade still runs there).
        location / {
            if ($origin = "") { rewrite ^ /__landing last; }
            access_by_lua_file    /etc/nginx/lua/verdict.lua;
            proxy_http_version    1.1;
            proxy_set_header      Host              $origin_host;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_ssl_name        $origin_sni;
            proxy_ssl_verify      off;
            # $origin_resolve is the loop-safe upstream URL (see its
            # set_by_lua_block above); $request_uri is the original path
            # + query, preserved when proxying. For hosts without the
            # short-circuit, $origin_resolve == $origin so this is a
            # behaviour-preserving substitution.
            proxy_pass            $origin_resolve$request_uri;
            log_by_lua_file       /etc/nginx/lua/log_event.lua;
        }

        # Bundled landing page — served when no ORIGIN_URL is set (internal
        # redirect target, not directly reachable). Runs the cascade + logs
        # so the demo exercises the full pipeline even without an upstream.
        location = /__landing {
            internal;
            # nginx.demo.conf doesn't `include mime.types`, so the alias'd
            # file would otherwise be served with the fallback type
            # (`application/octet-stream` from nginx's compile-time default)
            # or — after some openresty patches — `text/plain`. Either way
            # the browser shows the HTML as source code instead of
            # rendering it. Force text/html for this specific location.
            default_type       text/html;
            access_by_lua_file /etc/nginx/lua/verdict.lua;
            alias              /etc/nginx/sites/default-site/index.html;
            log_by_lua_file    /etc/nginx/lua/log_event.lua;
        }
    }
}
