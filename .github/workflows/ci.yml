name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (luajit in openresty container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            openresty/openresty:alpine \
            sh -c "luajit tests/ja4_helpers_test.lua && \
                   luajit tests/hygiene_test.lua && \
                   luajit tests/reputation_test.lua && \
                   luajit tests/rate_limit_test.lua && \
                   luajit tests/fp_blocklist_state_test.lua && \
                   luajit tests/tls_fp_test.lua"

  lint-lua:
    name: Lint Lua (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run luacheck
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            pipelinecomponents/luacheck:latest \
            luacheck $(find infra -name '*.lua')

  lint-go:
    name: Lint Go (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antibot-backend/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: antibot-backend

  test-go:
    name: Build Go (antibot-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antibot-backend/go.sum
      - name: go vet + build
        working-directory: antibot-backend
        run: |
          go vet ./...
          go build ./...

  lint-shell:
    name: Lint shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            koalaman/shellcheck:stable \
            $(find scripts infra -name '*.sh')
