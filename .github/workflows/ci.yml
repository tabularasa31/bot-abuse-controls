name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit token scope. `actions/checkout` needs only `contents: read`, but
# declaring it at the workflow level removes ambiguity in the token
# provisioning path — see the comment on each checkout step about the
# intermittent "could not read Username" flake. With this block, every job's
# GITHUB_TOKEN is guaranteed to carry contents: read regardless of org-level
# policy changes.
permissions:
  contents: read

jobs:
  # Detect whether the PR touches anything other than catalogs/ or docs. A
  # catalog-only PR (e.g. the blocklist autopilot's auto-update) needs only the
  # validate-catalogs gate — running the Go/Lua/smoke/integration suite on a
  # YAML-line change is pointless. The heavy jobs below are gated on
  # `needs.changes.outputs.code == 'true'`; validate-catalogs always runs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0
      - id: f
        name: code vs catalog/docs-only
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # push event (no PR context) → run everything.
          if [ -z "$base" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; printf '%s\n' "$changed"
          # code=true if any changed file is NOT catalogs/**, docs/**, or *.md
          if printf '%s\n' "$changed" | grep -qvE '^(catalogs/|docs/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Unit tests (luajit in openresty container)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            openresty/openresty:alpine \
            sh -c 'export LUA_PATH="infra/demo-stand/lua/?.lua;;"; \
                   luajit tests/ja4_helpers_test.lua && \
                   luajit tests/hygiene_test.lua && \
                   luajit tests/reputation_test.lua && \
                   luajit tests/rate_limit_test.lua && \
                   luajit tests/tls_fp_blocklist_state_test.lua && \
                   luajit tests/tls_fp_test.lua && \
                   luajit tests/catalog_pull_test.lua && \
                   luajit tests/log_shipper_test.lua && \
                   luajit tests/verified_bots_test.lua && \
                   luajit tests/policy_matchers_test.lua && \
                   luajit tests/challenge_secret_test.lua && \
                   luajit tests/challenge_test.lua && \
                   luajit tests/clearance_test.lua && \
                   luajit tests/verification_test.lua && \
                   luajit tests/recovery_test.lua && \
                   luajit tests/origin_resolve_test.lua && \
                   luajit tests/proxy_target_test.lua && \
                   luajit tests/policy_test.lua && \
                   luajit tests/tls_autossl_test.lua'

  lint-lua:
    name: Lint Lua (luacheck)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Run luacheck
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            pipelinecomponents/luacheck:latest \
            luacheck $(find infra -name '*.lua')

  lint-go:
    name: Lint Go (golangci-lint)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antibot-backend/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: antibot-backend

  test-go:
    name: Build Go (antibot-backend)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antibot-backend/go.sum
      - name: go vet + build
        working-directory: antibot-backend
        run: |
          go vet ./...
          go build ./...

  lint-shell:
    name: Lint shell (shellcheck)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Run shellcheck
        run: |
          # -x: follow `. ./lib.sh` sources (otherwise SC1091 fires on
          # every case sourcing tests/integration/lib.sh).
          docker run --rm -v "$PWD:/work" -w /work \
            koalaman/shellcheck:stable \
            -x $(find scripts infra tests -name '*.sh')

  validate-catalogs:
    name: Validate catalogs/ (filesource decode)
    # Catches the class of mistakes where catalogs/*.yaml parses with a lax
    # loader (e.g. `python -c "import yaml; yaml.safe_load(...)"`) but
    # `gopkg.in/yaml.v3` in strict mode — which is what the backend
    # filesource uses — rejects on reload. Concretely: duplicate map keys
    # (yaml.v3 strict: "mapping key already defined") and unknown status
    # values. Without this gate a merged PR sails through review and only
    # surfaces as `catalog reload failed` in backend logs minutes later, with
    # the stand silently serving the previous gen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: antibot-backend/go.sum
      - name: Run validate-catalogs against catalogs/
        working-directory: antibot-backend
        run: go run ./cmd/validate-catalogs ../catalogs

  smoke-demo-stand:
    name: Smoke (demo-stand brings up)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Catches broken Dockerfile / nginx.demo.conf / init_by_lua / Lua module
    # imports that would crash a `update.sh --force-recreate` on the live edge
    # but pass luacheck/unit tests. Without this gate, a bad commit on main
    # would auto-deploy to every edge VM via cron and crash-loop them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Generate self-signed TLS cert
        # nginx.demo.conf hard-requires fullchain.pem / privkey.pem in
        # infra/demo-stand/certs/. Gitignored on a real deploy, but on a fresh
        # CI checkout we just mint a throwaway one for the smoke.
        run: |
          mkdir -p infra/demo-stand/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout infra/demo-stand/certs/privkey.pem \
            -out   infra/demo-stand/certs/fullchain.pem \
            -subj "/CN=ci-smoke" \
            -addext "subjectAltName=DNS:ci-smoke"
      - name: docker compose up + wait for /__health
        env:
          REVISION: ${{ github.sha }}
          DEMO_BIND_IP: 127.0.0.1
        run: |
          cd infra/demo-stand
          docker compose -f docker-compose.demo.yml up -d --build
          # Poll /__health for up to 60 s — nginx-demo has no Docker healthcheck
          # defined, and a Lua init failure would show up as a container that
          # has started but isn't serving. Curl with `--retry-connrefused`
          # handles the brief gap between bind and accept.
          for i in $(seq 1 30); do
            if curl -sk --max-time 2 https://127.0.0.1/__health | grep -q ok; then
              echo "smoke ok after ${i} probes"
              exit 0
            fi
            sleep 2
          done
          echo "::error::nginx-demo did not respond to /__health within 60 s"
          docker compose -f docker-compose.demo.yml ps
          docker compose -f docker-compose.demo.yml logs --no-color nginx-demo
          exit 1
      - name: Tear down
        if: always()
        run: |
          cd infra/demo-stand
          docker compose -f docker-compose.demo.yml down -v --remove-orphans

  smoke-demo-backend:
    name: Smoke (demo-backend brings up)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Catches broken Dockerfile / Go service init / compose / nginx-lb config
    # before main lands on the backend VM. `update.sh` on the backend VM is
    # safer than the edge's (no --force-recreate; failed `up` keeps old
    # containers alive), but a bad commit still produces an infinite retry
    # loop in the cron log and blocks any future deploy until reverted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pass GITHUB_TOKEN explicitly. The action does this implicitly when
          # no token: is set, but in practice we've seen 6+ runs across PRs
          # #45-#51 where a random job fails the post-extraheader `git fetch`
          # with "could not read Username for github.com" — the symptom of an
          # auto-discovered token not being present in the fetch context.
          # Explicit passthrough sidesteps the discovery and is GitHub's
          # documented stable form.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Bootstrap certs + .env
        run: |
          cd infra/demo-backend
          ./scripts/gen-certs.sh    # server cert + edge-CA + sample client cert
          cat > .env <<EOF
          POSTGRES_DB=antibot
          POSTGRES_USER=antibot
          POSTGRES_PASSWORD=ci-smoke-$(openssl rand -hex 8)
          AUTH_MODE=ip-allowlist
          EOF
          chmod 600 .env
      - name: docker compose up + wait for /health
        run: |
          cd infra/demo-backend
          docker compose -f docker-compose.backend.yml up -d --build
          # Poll /health on the LB for up to 120 s. The Go service applies
          # migrations on startup and won't accept until they finish; the
          # postgres healthcheck adds another ~5 s on the front. 60 probes
          # × 2 s = 120 s budget.
          for i in $(seq 1 60); do
            if curl -sk --max-time 2 https://127.0.0.1/health | grep -q '"instance"'; then
              echo "smoke ok after ${i} probes"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend LB did not respond to /health within 120 s"
          docker compose -f docker-compose.backend.yml ps
          docker compose -f docker-compose.backend.yml logs --no-color
          exit 1
      - name: Tear down
        if: always()
        run: |
          cd infra/demo-backend
          docker compose -f docker-compose.backend.yml down -v --remove-orphans

  test-integration:
    name: Integration (Channel C contract, D8/B13)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # End-to-end harness from infra/test-harness/: postgres + antibot-backend
    # + edge under docker compose, four contract scenarios from
    # vision.md §«Обновление каталогов» (latency / atomicity / fail-stale /
    # staleness gauge). Catches regressions that pure-Lua unit tests can't
    # see — wire-level swap behaviour, cross-process timing, the staleness
    # metric as an external observable.
    #
    # Wall time budget: ~90s on a warm runner. The harness compresses pull
    # intervals to 1-2s (vs production 5s+30s) so the contract is asserted
    # in seconds, not minutes — see infra/test-harness/README.md
    # §"What's different vs production".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
      - name: Bring up integration stack
        run: make test-integration-up
      - name: Run cases
        run: make test-integration-run
      - name: Dump container logs (on success or failure)
        if: always()
        run: |
          docker compose -f infra/test-harness/docker-compose.test.yml \
            -p bac-test ps || true
          docker compose -f infra/test-harness/docker-compose.test.yml \
            -p bac-test logs --no-color --tail=300 || true
      - name: Tear down integration stack
        if: always()
        run: make test-integration-down
