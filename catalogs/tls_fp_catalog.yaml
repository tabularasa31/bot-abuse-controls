# tls_fp_catalog.yaml — the catalog of automation signatures by TLS fp.
#
# Used by the tls_fp_impersonator rule (soft category): if the UA
# claims a browser but the TLS fp hash_b matches a known automation
# signature — challenge. See docs/product/phase2-spec.md §"tls_fp_*".
#
# Format: map hash_b -> { family, status }.
#   - hash_b — the 12-character hex fragment of the TLS fp (see ja4_compute.lua).
#   - family — the short automation name (`python-requests`, `curl`,
#     `go-http-client`, `okhttp`, etc.). It is what ua_family is looked up by and what is emitted
#     verdict.
#   - status — active | staging.
#     active  → the tls_fp_impersonator rule may issue a challenge.
#     staging → the edge matches, writes staging_match into bac_log, does not block.
#
# An empty file means nothing matches. It is filled through PRs based on
# log analysis: product maps an observed hash_b against reference
# traffic (curl/python/go) and records the correspondence.

# Examples (uncomment when adding):
#   "a1b2c3d4e5f6":
#     family: curl
#     status: staging

# manual 2026-06-23 — python-requests disguised as Chrome (cipher_cnt=15). Matching on
# hash_b catches every JA4_c variant of this family at once (impersonator → challenge),
# unlike tls_fp_blocklist, where an exact match on the full fp missed the rotation of
# hash_c. The WordPress/xmlrpc brute-force campaign of 06-22→06-23 (4 hash_c variants,
# 100% browser UA, DC ASN, recon /wp-login.php + /xmlrpc.php).
"1ed0482b9b4c":
  family: python-requests
  status: active
