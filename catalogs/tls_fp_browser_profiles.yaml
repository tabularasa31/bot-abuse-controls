# tls_fp_browser_profiles.yaml — the expected cipher_cnt per browser family
#.
#
# Used by the tls_fp_suspicious_ciphers rule (soft category): if the UA
# looks like a browser but cipher_cnt does not match what the family should have —
# challenge.
#
# Format: map family -> { expected_cipher_cnt, status }.
#   - family — the short browser-family name as the UA parser emits it
#     (`chrome`, `firefox`, `safari`, `edge`, …).
#   - expected_cipher_cnt — the expected number of ciphers in the TLS handshake.
#   - status — active | staging.
#     active  → the tls_fp_suspicious_ciphers rule compares observed vs expected.
#     staging → staging_match in bac_log, does not challenge.
#
# The starting set reflects current observations of the major browsers. When a new
# major browser version shifts the count, first land a PR with status=staging alongside
# the old entry, then promote after calibration.

chrome:
  expected_cipher_cnt: 15
  status: active

firefox:
  expected_cipher_cnt: 16
  status: active

safari:
  expected_cipher_cnt: 20
  status: active

# Edge on Blink normally matches Chrome.
edge:
  expected_cipher_cnt: 15
  status: active
