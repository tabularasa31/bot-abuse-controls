# ua_blacklist.yaml — RE2 regex patterns over the User-Agent that the cascade
# treats as bots / automation.
#
# Format: <pattern>: <status>.
#   - pattern — a regex string (RE2, as in Go regexp.Compile). Every line is
#     validated at backend startup; one broken entry fails the whole load
#     (fail-stale) — better to fail than to ship into the combined regex and take
#     the UA stage down across the edges.
#   - status — active | staging.
#     active  → the edge adds it to the combined regex and emits verdict=block,
#               rule=ua_blacklist on a match.
#     staging → the pattern goes into a separate combined regex; the edge writes
#               staging_match and does not block.
#
# An empty file means nothing matches. It is filled through PRs based on
# log analysis (see docs/product/vision.md §"User-Agent — into the UA blacklist").

# Examples (uncomment when adding):
#   "curl/.*": active
#   "python-requests/.*": active
#   "scrapy/[0-9.]+": staging

# --- Seed: unambiguous scanners / bad bots (status=active). Moved here
# --- from the edge config infra/demo-stand/config/ua_blacklist.conf after migrating
# --- ua_blacklist onto Channel C: this file is now the source of truth,
# --- otherwise the edge lost these patterns after the first pull (the config seed was replaced
# --- by an empty catalog). Honest UAs, zero business value, no FP risk for
# --- real users. YAML single-quoted so that `\b` stays literal.
'(?i)\bzgrab\b': active
'(?i)\bl9scan\b': active
'(?i)\bsqlmap\b': active
'(?i)\bnikto\b': active
'(?i)\bmasscan\b': active
'(?i)\bnuclei\b': active
'(?i)\bwpscan\b': active
'(?i)\bAhrefsBot\b': active
'(?i)\bSemrushBot\b': active
'(?i)\bMJ12bot\b': active
'(?i)\bDotBot\b': active
