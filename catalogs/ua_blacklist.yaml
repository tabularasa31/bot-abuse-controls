# ua_blacklist.yaml — RE2-regex паттерны по User-Agent, которые каскад
# трактует как ботов / автоматизацию.
#
# Формат: <pattern>: <status>.
#   - pattern — строка regex (RE2, как в Go regexp.Compile). Каждая строка
#     валидируется на старте backend'а; одна битая запись валит всю загрузку
#     (fail-stale) — лучше упасть, чем уехать в combined regex и положить
#     UA-стадию на эджах.
#   - status — active | staging.
#     active  → эдж добавляет в combined regex, эмитит verdict=block,
#               rule=ua_blacklist при матче.
#     staging → паттерн идёт отдельным combined regex, эдж пишет
#               staging_match, не блокирует.
#
# Пустой файл = ничего не матчим. Наполняется через PR по результатам
# анализа логов (см. docs/product/vision.md §"User-Agent — в UA-blacklist").

# Примеры (раскомментируйте при добавлении):
#   "curl/.*": active
#   "python-requests/.*": active
#   "scrapy/[0-9.]+": staging

# --- Seed: однозначные сканеры / плохие боты (status=active). Перенесены сюда
# --- из edge-конфига infra/demo-stand/config/ua_blacklist.conf после миграции
# --- ua_blacklist на Channel C (86exrtjpc): теперь источник истины — этот файл,
# --- иначе после первого pull эдж терял эти паттерны (конфиг-seed замещался
# --- пустым каталогом). Honest UAs, нулевая бизнес-ценность, без FP-риска для
# --- реальных пользователей. YAML single-quoted — чтобы `\b` оставался literal.
'(?i)\bzgrab\b': active
'(?i)\bl9scan\b': active
'(?i)\bsqlmap\b': active
'(?i)\bnikto\b': active
'(?i)\bmasscan\b': active
'(?i)\bnuclei\b': active
'(?i)\bwpscan\b': active
'(?i)\bAhrefsBot\b': active
'(?i)\bSemrushBot\b': active
'(?i)\bMJ12bot\b': active
'(?i)\bDotBot\b': active
