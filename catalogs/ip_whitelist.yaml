# ip_whitelist.yaml — системный IP-whitelist (мониторинг, чек-сервисы,
# доверенные системные клиенты).
#
# Формат: список строк-CIDR. Без status — whitelist всегда active; staging
# для allow-list бессмыслен (если запись ошибочна, легитимный трафик
# просто продолжит идти по обычному каскаду, а не "тише" блокируется).
#
# Per-resource IP-whitelist клиента (CIDR из дашборда) живёт в
# policy[host].ip_whitelist в БД, сюда не дублируется.

# Примеры:
#   - 198.51.100.5/32   # системный мониторинг
#   - 2001:db8::1       # bare IPv6 — ipmatcher принимает как /128
