# ip_whitelist.yaml — the system IP whitelist (monitoring, check services,
# trusted system clients).
#
# Format: a list of CIDR strings. No status — a whitelist is always active; staging
# is meaningless for an allow list (if an entry is wrong, legitimate traffic
# simply keeps going through the normal cascade rather than being blocked "more quietly").
#
# A customer's per-resource IP whitelist (CIDRs from the dashboard) lives in
# policy[host].ip_whitelist in the database; it is not duplicated here.

# Examples:
#   - 198.51.100.5/32   # system monitoring
#   - 2001:db8::1       # bare IPv6 — ipmatcher reads it as /128

# NB: in the current stand the allow side does NOT fastpass — a whitelisted IP that also
# lands in tls_fp_blocklist is still cut downstream (verdict.lua, task
# ). The entry below becomes a real bypass once fastpass lands.
- 203.0.113.10/32   # operator, ASN 64512 — 2026-06-23
