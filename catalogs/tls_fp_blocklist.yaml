# tls_fp_blocklist.yaml — the TLS fingerprints the cascade treats as
# bots (vision/entities-reference §"Catalogs", rule `tls_fp_blocklist`).
#
# Format: <fp>: <status>, where
#   - fp     — a string of the form L<ver><sni><cipher_cnt><alpn>_<hash_b>_<hash_c>
#              (see infra/demo-stand/lua/ja4_compute.lua).
#   - status — active | staging.
#     active  → the edge emits verdict=block, rule=tls_fp_blocklist.
#     staging → the edge matches and writes staging_match into bac_log, does NOT block.
#
# Promoting staging → active is a separate PR that changes the status. That gives us
# two review points and an explicit moment of enforcement.
#
# An empty file means an empty catalog. The cascade blocks nobody at this layer
# until product adds the first entry through a PR.

# Examples (uncomment when adding):
#   "L13i17h2_abc_def_111": active
#   "L12i14h1_ghi_jkl_222": staging

