# asn_datacenters.yaml — datacenter ASNs. At L2.3 the cascade tags
# requests whose ASN is in this list as reputation:asn_dc; the per-resource
# policy[host].asn_block then decides whether to emit verdict=block.
#
# Format: a list of uint32 (RFC 6793 32-bit ASN). No status — this is
# a reference table of "which ASNs count as datacenters"; the tag itself blocks
# nothing (blocking lives in the per-resource policy).

# Amazon Web Services
- 16509   # Amazon AWS (the main pool, shows up in every region)
- 14618   # Amazon Data Services (AWS East)

# Google Cloud Platform
- 396982  # Google Cloud

# Microsoft Azure
- 8075    # Microsoft Azure

# DigitalOcean
- 14061   # DigitalOcean

# Hetzner Online
- 24940   # Hetzner

# Oracle Cloud
- 31898   # Oracle Cloud Infrastructure

# Linode / Akamai Cloud
- 63949   # Linode (Akamai)
