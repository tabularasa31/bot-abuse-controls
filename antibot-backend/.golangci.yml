# A strict but non-aesthetic set of linters for antibot-backend.
# The principle: a linter should catch a bug (correctness, security, resources), not taste.
# Deliberately NOT enabled: function length and complexity, naming, blank-line
# placement, "identical strings → a constant", "no globals/init" and the like.
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    # ---- baseline correctness ----
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple

    # ---- bugs / resources / context ----
    - bidichk                    # Unicode-trojan source (CVE-2021-42574)
    - bodyclose                  # an unclosed resp.Body
    - contextcheck               # passing a context, not a background one mid-chain
    - durationcheck              # multiplying a time.Duration by a time.Duration
    - errchkjson                 # unhandled json.Marshal errors
    - errorlint                  # ==err / a type assert instead of errors.Is/As, %w
    - gocheckcompilerdirectives  # //go: with typos
    - makezero                   # make([]T, n) with n>0 followed by append — a common bug
    - nilerr                     # `return nil` after `if err != nil`
    - noctx                      # http.NewRequest without a context
    - predeclared                # variables and functions named after builtins
    - reassign                   # reassigning package-level vars from stdlib
    - rowserrcheck               # sql.Rows.Err() not checked
    - sqlclosecheck              # sql.Rows / sql.Stmt not closed
    - unconvert                  # useless type conversions
    - unparam                    # unused parameters and return values
    - usestdlibvars              # http.StatusOK instead of 200 and so on

    # ---- security ----
    - gosec                      # SQL injection, weak crypto, file perms, hardcoded creds

    # ---- quality (in moderation) ----
    - gocritic                   # a large bundle; the default set is sensible
    - misspell                   # English typos
    - nakedret                   # a naked return in long functions
    - prealloc                   # slices with a known length should be preallocated

    # ---- formatting ----
    - gofmt
    - gofumpt
    - goimports

linters-settings:
  errcheck:
    # We do not require checking errors from Write on a ResponseWriter / json.NewEncoder.Encode:
    # they come from a broken connection, and it is too late and pointless to react.
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*encoding/json.Encoder).Encode
  gosec:
    excludes:
      - G104  # a duplicate of errcheck
  gocritic:
    disabled-checks:
      - ifElseChain   # subjective
      - singleCaseSwitch  # often deliberate (preparing for extension)
  nakedret:
    max-func-lines: 20
  goimports:
    local-prefixes: github.com/tabularasa31/bot-abuse-controls/antibot-backend

issues:
  # We silence nothing by default (golangci-lint silences some things in exclude-rules
  # for tests — we keep that, it is sensible).
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
